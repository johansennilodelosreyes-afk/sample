  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

<body>
<div id="root"></div>
<script>
  window.storage = {
    get: async function (k) {
      var r = localStorage.getItem("rl:" + k);
      if (r === null) throw new Error("not found");
      return { key: k, value: r };
    },
    set: async function (k, v) {
      var fullKey = "rl:" + k;
      try {
        localStorage.setItem(fullKey, v);
        return { key: k, value: v };
      } catch (e) {
        console.warn("LocalStorage quota error, attempting auto-prune of old cached months:", e);
        try {
          var keysToRemove = [];
          for (var i = 0; i < localStorage.length; i++) {
            var lk = localStorage.key(i);
            if (lk && lk.startsWith("rl:entries:")) {
              keysToRemove.push(lk);
            }
          }
          keysToRemove.sort();
          for (var j = 0; j < keysToRemove.length; j++) {
            if (keysToRemove[j] !== fullKey) {
              localStorage.removeItem(keysToRemove[j]);
              try {
                localStorage.setItem(fullKey, v);
                console.log("Auto-pruned " + keysToRemove[j] + " successfully!");
                return { key: k, value: v };
              } catch(retryErr) {}
            }
          }
          return { key: k, value: v, warning: "storage_quota_exceeded" };
        } catch(pruneErr) {
          return { key: k, value: v, warning: "storage_quota_exceeded" };
        }
      }
    },
    delete: async function (k) {
      localStorage.removeItem("rl:" + k);
      return { key: k, deleted: true };
    }
  };
  // ── PWA Install Button support ──
  window.deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.deferredInstallPrompt = e;
    window.dispatchEvent(new Event("pwa-install-available"));
  });
  window.addEventListener("appinstalled", function () {
    window.deferredInstallPrompt = null;
    window.dispatchEvent(new Event("pwa-installed"));
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  // ── Firebase Realtime Database: single-source-of-truth data layer ──
  // Firebase is authoritative. localStorage is cache/preferences only.
  // Normal operation uses realtime listeners; no whole-root PUT/restore is used.
  var FIREBASE_DB_URL = "https://banahaw-food-park-default-rtdb.firebaseio.com";
  var FIREBASE_RECORD_PATH = "banahaw_food_park"; // v28 realtime architecture
  var ACTIVITY_LOG_MAX = 300;
  var CACHE_MONTHS_TO_KEEP = 3;
  var cloudSyncState = "idle";
  var BANHAW_DEVICE_ID = (function () {
    try {
      var k="rl:deviceId", x=localStorage.getItem(k);
      if(!x){x="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,x);}
      return x;
    } catch(e){return "dev_unknown";}
  })();

  var firebaseReady=false, firebaseDb=null;
  try{
    if(!firebase.apps.length) firebase.initializeApp({databaseURL:FIREBASE_DB_URL});
    firebaseDb=firebase.database(); firebaseReady=true;
  }catch(e){console.warn("Firebase initialization failed; offline cache remains available.",e);}

  // ---------- IndexedDB offline outbox ----------
  var OUTBOX_DB="banahaw_food_park_offline", OUTBOX_STORE="mutations", outboxDbPromise=null;
  function openOutboxDb(){
    if(!window.indexedDB) return Promise.resolve(null);
    if(outboxDbPromise) return outboxDbPromise;
    outboxDbPromise=new Promise(function(resolve){
      try{
        var req=indexedDB.open(OUTBOX_DB,1);
        req.onupgradeneeded=function(){
          var db=req.result;
          if(!db.objectStoreNames.contains(OUTBOX_STORE)){
            var st=db.createObjectStore(OUTBOX_STORE,{keyPath:"id"});
            st.createIndex("ts","ts",{unique:false});
          }
        };
        req.onsuccess=function(){resolve(req.result);};
        req.onerror=function(){resolve(null);};
      }catch(e){resolve(null);}
    });
    return outboxDbPromise;
  }
  async function queueMutation(m){
    var db=await openOutboxDb();
    if(!db){try{localStorage.setItem("rl:outbox_fallback",JSON.stringify(m));}catch(e){}return;}
    return new Promise(function(resolve){
      try{var tx=db.transaction(OUTBOX_STORE,"readwrite");tx.objectStore(OUTBOX_STORE).put(m);tx.oncomplete=resolve;tx.onerror=resolve;}catch(e){resolve();}
    });
  }
  async function readQueuedMutations(){
    var db=await openOutboxDb(); if(!db)return [];
    return new Promise(function(resolve){
      try{
        var req=db.transaction(OUTBOX_STORE,"readonly").objectStore(OUTBOX_STORE).getAll();
        req.onsuccess=function(){var a=req.result||[];a.sort(function(x,y){return String(x.ts).localeCompare(String(y.ts));});resolve(a);};
        req.onerror=function(){resolve([]);};
      }catch(e){resolve([]);}
    });
  }
  async function removeQueuedMutation(id){var db=await openOutboxDb();if(!db)return;try{db.transaction(OUTBOX_STORE,"readwrite").objectStore(OUTBOX_STORE).delete(id);}catch(e){}}

  function setCloudStatus(state,message){cloudSyncState=state;window.dispatchEvent(new CustomEvent("cloudsync",{detail:message||state}));}
  function cloudPath(parts){return FIREBASE_RECORD_PATH+"/"+parts.map(function(p){return String(p).replace(/[.#$\[\]]/g,"_");}).join("/");}
  function keyParts(key){return String(key||"").split(":");}
  function targetPathForLegacyKey(key){
    var p=keyParts(key);
    if(p[0]==="tenants"&&p.length===2)return cloudPath(["tenants",p[1]]);
    if(p[0]==="entries"&&p.length===4)return cloudPath(["entries",p[1],p[2],p[3]]);
    if(p[0]==="ambagan"&&p.length===2)return cloudPath(["ambagan",p[1]]);
    if(p[0]==="activityLog")return cloudPath(["activityLog"]);
    if(p[0]==="pin")return cloudPath(["settings","pin"]);
    return cloudPath(["settings",p[0]||"misc"]);
  }
  function normalizeTenantCollection(v){
    if(Array.isArray(v))return v;
    if(!v||typeof v!=="object")return [];
    return Object.keys(v).map(function(id){return v[id];}).filter(Boolean);
  }

  // Firebase snapshots are authoritative. Kept for existing report code that still
  // calls mergeEntries(local, remote).
  function mergeEntries(local, remote){
    if(remote && typeof remote === "object") return remote;
    return local || {};
  }
  function cacheKey(k){return "rl:"+k;}
  async function cacheGet(k){try{var v=localStorage.getItem(cacheKey(k));return v===null?null:v;}catch(e){return null;}}
  async function cacheSet(k,v){
    try{localStorage.setItem(cacheKey(k),v);pruneLocalCache();}
    catch(e){try{
      var a=[];for(var i=0;i<localStorage.length;i++){var x=localStorage.key(i);if(x&&x.indexOf("rl:entries:")===0)a.push(x);}
      for(var j=0;j<a.length;j++)if(a[j]!==cacheKey(k))localStorage.removeItem(a[j]);
      localStorage.setItem(cacheKey(k),v);
    }catch(e2){}}
  }
  function pruneLocalCache(){
    try{
      var now=new Date(),keep={};
      for(var i=0;i<CACHE_MONTHS_TO_KEEP;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);keep[d.getFullYear()+"-"+pad(d.getMonth()+1)]=true;}
      var remove=[];
      for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j),m=k&&k.match(/^rl:entries:.*:(\d{4}-\d{2})$/);if(m&&!keep[m[1]])remove.push(k);}
      remove.forEach(function(k){localStorage.removeItem(k);});
    }catch(e){}
  }

  async function fetchKeyFromCloud(key){
    if(!firebaseReady||!firebaseDb)return null;
    try{var v=await firebaseDb.ref(targetPathForLegacyKey(key)).once("value").then(function(s){return s.val();});
      return keyParts(key)[0]==="tenants"?normalizeTenantCollection(v):v;
    }catch(e){console.warn("Firebase read failed:",e);return null;}
  }
  function subscribeKeyFromCloud(key,onValue){
    if(!firebaseReady||!firebaseDb)return function(){};
    var ref=firebaseDb.ref(targetPathForLegacyKey(key));
    var handler=function(snap){var v=snap.val();if(keyParts(key)[0]==="tenants")v=normalizeTenantCollection(v);try{cacheSet(key,JSON.stringify(v));}catch(e){}onValue(v,{source:"firebase"});};
    ref.on("value",handler);return function(){try{ref.off("value",handler);}catch(e){}};
  }
  window.subscribeKeyFromCloud=subscribeKeyFromCloud;

  // Writes one ledger day only. A transaction merges the patch with the latest Firebase day,
  // preventing a stale device from erasing another device's signature/payment fields.
  async function syncEntryDay(category,tenantId,month,dayKey,patch,mutationTime){
    var path=cloudPath(["entries",category,tenantId,month,dayKey]), ts=mutationTime||new Date().toISOString();
    if(!firebaseReady||!firebaseDb){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"entryDay",path:path,patch:patch,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
    try{
      var result=await firebaseDb.ref(path).transaction(function(current){
        var next=(current&&typeof current==="object")?Object.assign({},current):{};
        Object.keys(patch||{}).forEach(function(k){if(patch[k]===undefined)delete next[k];else next[k]=patch[k];});
        next._meta={updatedAt:ts,updatedBy:BANHAW_DEVICE_ID};return next;
      });
      if(!result.committed){
        await queueMutation({id:Date.now()+"_"+Math.random(),kind:"entryDay",path:path,patch:patch,ts:ts,deviceId:BANHAW_DEVICE_ID});
      } else if (Object.prototype.hasOwnProperty.call(patch || {}, "signature")) {
        var sidPath = cloudPath(["signatures",tenantId+"__"+dayKey]);
        var sigValue = patch.signature;
        if (sigValue) {
          await firebaseDb.ref(sidPath).set({tenantId:tenantId,category:category,date:dayKey,image:sigValue,updatedAt:ts,updatedBy:BANHAW_DEVICE_ID,active:true});
        } else {
          await firebaseDb.ref(sidPath).update({active:false,updatedAt:ts,updatedBy:BANHAW_DEVICE_ID});
        }
      }
      return !!result.committed;
    }catch(e){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"entryDay",path:path,patch:patch,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
  }
  window.syncEntryDay=syncEntryDay;

  async function syncTenants(category,list,mutationTime,baseList){
    var path=cloudPath(["tenants",category]),desired=Array.isArray(list)?list:[],base=Array.isArray(baseList)?baseList:[],ts=mutationTime||new Date().toISOString();
    if(!firebaseReady||!firebaseDb){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"tenants",path:path,value:desired,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
    try{
      var result=await firebaseDb.ref(path).transaction(function(current){
        var cur=normalizeTenantCollection(current),byId={};cur.forEach(function(t){if(t&&t.id)byId[t.id]=t;});
        var baseById={};base.forEach(function(t){if(t&&t.id)baseById[t.id]=t;});
        var desiredById={};desired.forEach(function(t){if(t&&t.id)desiredById[t.id]=t;});
        Object.keys(desiredById).forEach(function(id){byId[id]=desiredById[id];});
        // Only delete an ID if it existed in this device's base snapshot. A concurrent
        // tenant added by another device is therefore preserved.
        Object.keys(baseById).forEach(function(id){if(!desiredById[id])delete byId[id];});
        return byId;
      });
      if(!result.committed)await queueMutation({id:Date.now()+"_"+Math.random(),kind:"tenants",path:path,value:desired,ts:ts,deviceId:BANHAW_DEVICE_ID});
      return !!result.committed;
    }catch(e){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"tenants",path:path,value:desired,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
  }

  async function syncLegacyKeyToCloud(key,value,mutationTime,baseValue){
    var p=keyParts(key),ts=mutationTime||new Date().toISOString();
    if(p[0]==="tenants"&&p.length===2)return syncTenants(p[1],JSON.parse(value),ts,baseValue||[]);
    var path=targetPathForLegacyKey(key),val;try{val=JSON.parse(value);}catch(e){val=value;}
    if(!firebaseReady||!firebaseDb){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"set",path:path,value:val,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
    try{await firebaseDb.ref(path).set(val);return true;}catch(e){await queueMutation({id:Date.now()+"_"+Math.random(),kind:"set",path:path,value:val,ts:ts,deviceId:BANHAW_DEVICE_ID});return false;}
  }

  async function flushOutbox(){
    if(!navigator.onLine||!firebaseReady)return;
    var list=await readQueuedMutations();
    for(var i=0;i<list.length;i++){
      var item=list[i],ok=false;
      try{
        if(item.kind==="entryDay"){
          var snap=await firebaseDb.ref(item.path).once("value"),current=snap.val()||{},next=Object.assign({},current);
          Object.keys(item.patch||{}).forEach(function(k){if(item.patch[k]===undefined)delete next[k];else next[k]=item.patch[k];});
          next._meta={updatedAt:item.ts,updatedBy:item.deviceId||BANHAW_DEVICE_ID};await firebaseDb.ref(item.path).set(next);
          if(Object.prototype.hasOwnProperty.call(item.patch||{},"signature")){
            var seg=item.path.split("/");
            var cat=seg[2],tid=seg[3],day=seg[5],sp=cloudPath(["signatures",tid+"__"+day]);
            if(item.patch.signature) await firebaseDb.ref(sp).set({tenantId:tid,category:cat,date:day,image:item.patch.signature,updatedAt:item.ts,updatedBy:item.deviceId||BANHAW_DEVICE_ID,active:true});
            else await firebaseDb.ref(sp).update({active:false,updatedAt:item.ts,updatedBy:item.deviceId||BANHAW_DEVICE_ID});
          }
        }else await firebaseDb.ref(item.path).set(item.value);
        ok=true;
      }catch(e){ok=false;}
      if(ok)await removeQueuedMutation(item.id);
    }
    setCloudStatus("synced","Database Synced ✓");
  }
  window.addEventListener("online",function(){flushOutbox();});
  window.addEventListener("offline",function(){setCloudStatus("offline","Offline — changes will sync automatically");});
  setInterval(function(){if(navigator.onLine)flushOutbox();},15000);

  // UI compatibility. This is cache only; callers explicitly sync changes.
  window.storage={
    get:async function(k){var v=await cacheGet(k);if(v===null)throw new Error("not found");return{key:k,value:v};},
    set:async function(k,v){await cacheSet(k,v);return{key:k,value:v};},
    delete:async function(k){try{localStorage.removeItem(cacheKey(k));}catch(e){}return{key:k,deleted:true};}
  };

  function logActivity(action,detail){
    try{var raw=localStorage.getItem("rl:activityLog"),log=raw?JSON.parse(raw):[];log.unshift({ts:new Date().toISOString(),action:action,detail:detail||"",deviceId:BANHAW_DEVICE_ID});if(log.length>ACTIVITY_LOG_MAX)log=log.slice(0,ACTIVITY_LOG_MAX);localStorage.setItem("rl:activityLog",JSON.stringify(log));syncLegacyKeyToCloud("activityLog",JSON.stringify(log));}catch(e){console.warn("logActivity failed:",e);}
  }
  window.logActivity=logActivity;
  function autoBackupToCloud(key,val){if(!key||val===undefined)return;setCloudStatus("syncing","Saving to database…");syncLegacyKeyToCloud(key,val).then(function(ok){setCloudStatus(ok?"synced":"offline",ok?"Database Synced ✓":"Offline — changes will sync automatically");}).catch(function(){setCloudStatus("offline","Offline — changes will sync automatically");});}

  // Kept only for old button handlers. These never replace Firebase with local data.
  async function cloudBackup(){await flushOutbox();setCloudStatus("synced","Database Synced ✓");return true;}
  async function cloudRestore(){if(!firebaseReady)throw new Error("Firebase unavailable");return true;}

  function compressSignatureCanvas(canvas) {
    try {
      var ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;
      var imgData = ctx.getImageData(0, 0, w, h);
      var data = imgData.data;

      var minX = w, minY = h, maxX = 0, maxY = 0;
      var hasPixels = false;

      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var idx = (y * w + x) * 4;
          var r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
          if (a > 20 && (r < 235 || g < 235 || b < 235)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            hasPixels = true;
          }
        }
      }

      if (!hasPixels) return null;

      var pad = 6;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(w - 1, maxX + pad);
      maxY = Math.min(h - 1, maxY + pad);

      var cropW = maxX - minX + 1;
      var cropH = maxY - minY + 1;

      var maxTargetW = 240;
      var maxTargetH = 90;
      var scale = Math.min(1, maxTargetW / cropW, maxTargetH / cropH);

      var targetW = Math.round(cropW * scale);
      var targetH = Math.round(cropH * scale);

      var offscreen = document.createElement('canvas');
      offscreen.width = targetW;
      offscreen.height = targetH;
      var oCtx = offscreen.getContext('2d');

      oCtx.fillStyle = '#FFFFFF';
      oCtx.fillRect(0, 0, targetW, targetH);
      oCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, targetW, targetH);

      return offscreen.toDataURL('image/png');
    } catch (err) {
      console.warn("Signature compression fallback:", err);
      return canvas.toDataURL("image/png");
    }
  }
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const C = {
  navy: "#1B2A4A", navyL: "#2C3E6B", gold: "#C5961A", goldBg: "#FFF8E7",
  green: "#27763D", greenBg: "#E8F5EC", red: "#B33025", redBg: "#FDE8E6",
  paper: "#FAFAF7", paperAlt: "#F4F2EC", ink: "#1E1E1E", inkS: "#5C5C5C",
  border: "#DDD8CC", borderL: "#ECEAE0", white: "#FFFFFF",
};
const GARBAGE = 10;

function pad(n) { return String(n).padStart(2, "0"); }
function dim(y, m) { return new Date(y, m, 0).getDate(); }
function dk(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function peso(n) { return "\u20B1" + (Number(n) || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function pesoPdf(n) { return "P" + (Number(n) || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "t"; }
const CATEGORY_LABELS = { foodtruck: "Food Truck", mobilecart: "Mobile Cart", tent2x2: "Tent 2\u00D72" };
function categoryLabel(cat) { return CATEGORY_LABELS[cat] || cat; }

function doBackup() {
  const d = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("rl:")) d[k] = localStorage.getItem(k); }
  const b = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = `rent-ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

function rowRent(e, s) { if (e.rentAmount != null) return Number(e.rentAmount); if (e.status === 'present') return Number(s.presentFee) || 0; if (e.status === 'absent') return Number(s.absentFee) || 0; return 0; }
function rowAyka(e, s) { if (e.aykaShare != null) return Number(e.aykaShare) + rowGarb(e); if (e.status === 'present') return (s.presentAykaShare != null ? Number(s.presentAykaShare) : Math.round((Number(s.presentFee) || 0) * 0.7)) + GARBAGE; if (e.status === 'absent') return s.absentAykaShare != null ? Number(s.absentAykaShare) : Math.round((Number(s.absentFee) || 0) * 0.7); return 0; }
function rowMother(e, s) { if (e.motherShare != null) return Number(e.motherShare); if (e.status === 'present') return s.presentMotherShare != null ? Number(s.presentMotherShare) : ((Number(s.presentFee) || 0) - (s.presentAykaShare != null ? Number(s.presentAykaShare) : Math.round((Number(s.presentFee) || 0) * 0.7))); if (e.status === 'absent') return s.absentMotherShare != null ? Number(s.absentMotherShare) : ((Number(s.absentFee) || 0) - (s.absentAykaShare != null ? Number(s.absentAykaShare) : Math.round((Number(s.absentFee) || 0) * 0.7))); return 0; }
function rowGarb(e) { return e.status === "present" ? GARBAGE : 0; }
function rowTot(e, s) { return rowRent(e, s) + rowGarb(e); }
function rowPaid(e, s) { if (!e.status) return 0; if (e.amountPaid != null) return Number(e.amountPaid); if (e.signature) return rowTot(e, s); return 0; }
function rowBal(e, s) { if (!e.status) return 0; var tot = rowTot(e, s); var pd = rowPaid(e, s); return Math.max(0, tot - pd); }

function LockScreen({ onUnlock }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [setting, setSetting] = useState(false);
  const [pin2, setPin2] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [hasPin, setHasPin] = useState(true);

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get("pin"); setHasPin(!!r.value); } catch { setHasPin(false); }
      setLoaded(true);
    })();
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    if (!loaded) return;
    if (!hasPin || setting) {
      if (pin.length < 4) { setErr("PIN must be at least 4 digits"); return; }
      if (setting && pin !== pin2) { setErr("PINs do not match"); return; }
      await window.storage.set("pin", pin);
      autoBackupToCloud("pin", pin);
      setHasPin(true); setSetting(false); setPin(""); setPin2(""); setErr("");
      onUnlock();
      return;
    }
    try {
      const r = await window.storage.get("pin");
      if (pin === r.value) { setPin(""); setErr(""); onUnlock(); }
      else { setErr("Wrong PIN"); setPin(""); }
    } catch { onUnlock(); }
  };

  if (!loaded) return <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center" }}><div className="fade-in" style={{ textAlign: "center" }}><div style={{ width: 48, height: 48, border: `3px solid ${C.border}`, borderTopColor: C.navy, borderRadius: "50%", animation: "spin 1s linear infinite", margin: "0 auto 12px" }} /><span style={{ color: C.inkS, fontSize: 14 }}>Loading...</span></div></div>;

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(160deg, ${C.navy} 0%, ${C.navyL} 100%)`, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: 360, maxWidth: "100%", textAlign: "center" }}>
        <div style={{ width: 64, height: 64, borderRadius: 16, background: "rgba(255,255,255,0.12)", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 32, marginBottom: 20, border: "1px solid rgba(255,255,255,0.15)" }}>🔒</div>
        <div style={{ fontSize: 24, fontWeight: 700, color: "#fff", fontFamily: "'DM Serif Display', Georgia, serif", marginBottom: 6 }}>Banahaw Food Park</div>
        <div style={{ fontSize: 13, color: "rgba(255,255,255,0.55)", marginBottom: 28 }}>
          {!hasPin && !setting ? "Create a PIN to secure your ledger" : setting ? "Set up your PIN" : "Enter your PIN to continue"}
        </div>

        <form onSubmit={submit}>
          {!hasPin && !setting ? (
            <button type="button" onClick={() => setSetting(true)}
              style={{ width: "100%", padding: 14, background: C.gold, color: "#fff", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "Inter, sans-serif" }}>
              Create PIN
            </button>
          ) : (
            <>
              <input type="password" inputMode="numeric" maxLength={8} autoFocus placeholder={setting ? "New PIN" : "Enter PIN"} value={pin}
                onChange={(e) => { setPin(e.target.value.replace(/\D/g, "")); setErr(""); }}
                style={{ width: "100%", padding: "14px 16px", border: "2px solid rgba(255,255,255,0.2)", borderRadius: 10, fontSize: 22, fontFamily: "'JetBrains Mono', monospace", background: "rgba(255,255,255,0.08)", color: "#fff", textAlign: "center", letterSpacing: 8, marginBottom: 10 }} />
              {setting && (
                <input type="password" inputMode="numeric" maxLength={8} placeholder="Confirm PIN" value={pin2}
                  onChange={(e) => { setPin2(e.target.value.replace(/\D/g, "")); setErr(""); }}
                  style={{ width: "100%", padding: "14px 16px", border: "2px solid rgba(255,255,255,0.2)", borderRadius: 10, fontSize: 22, fontFamily: "'JetBrains Mono', monospace", background: "rgba(255,255,255,0.08)", color: "#fff", textAlign: "center", letterSpacing: 8, marginBottom: 10 }} />
              )}
              {err && <div style={{ fontSize: 13, color: "#F87171", marginBottom: 10, fontWeight: 500 }}>{err}</div>}
              <button type="submit" style={{ width: "100%", padding: 14, background: "#fff", color: C.navy, border: "none", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "Inter, sans-serif" }}>
                {setting ? "Set PIN" : "Unlock"}
              </button>
              {setting && hasPin && (
                <button type="button" onClick={() => { setSetting(false); setPin(""); setPin2(""); setErr(""); }}
                  style={{ width: "100%", padding: 10, background: "transparent", color: "rgba(255,255,255,0.5)", border: "none", fontSize: 13, cursor: "pointer", marginTop: 8 }}>
                  Cancel
                </button>
              )}
            </>
          )}
        </form>
      </div>
    </div>
  );
}

function SignaturePad({ initial, onSave, onClose }) {
  const cv = useRef(null), drw = useRef(false), has = useRef(false);
  const [empty, setEmpty] = useState(true);

  useEffect(() => {
    const c = cv.current, ctx = c.getContext("2d");
    ctx.fillStyle = "#FFF"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.strokeStyle = C.navy; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (initial) {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, c.width, c.height); setEmpty(false); has.current = true; };
      img.src = initial;
    }
  }, [initial]);

  const pos = (e) => {
    const c = cv.current, r = c.getBoundingClientRect(), sx = c.width / r.width, sy = c.height / r.height;
    const t = e.touches && e.touches[0];
    return { x: ((t || e).clientX - r.left) * sx, y: ((t || e).clientY - r.top) * sy };
  };
  const down = (e) => { e.preventDefault(); drw.current = true; const { x, y } = pos(e); const ctx = cv.current.getContext("2d"); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = (e) => { if (!drw.current) return; e.preventDefault(); const { x, y } = pos(e); const ctx = cv.current.getContext("2d"); ctx.lineTo(x, y); ctx.stroke(); has.current = true; setEmpty(false); };
  const up = () => { drw.current = false; };
  const clear = () => { const ctx = cv.current.getContext("2d"); ctx.fillStyle = "#FFF"; ctx.fillRect(0, 0, cv.current.width, cv.current.height); has.current = false; setEmpty(true); };

  const handleSave = () => {
    if (!has.current) return;
    const compressedDataUrl = compressSignatureCanvas(cv.current);
    if (!compressedDataUrl) {
      alert("Please draw a signature before saving.");
      return;
    }
    onSave(compressedDataUrl);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: 14, padding: 24, width: 420, maxWidth: "100%", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: C.ink }}>Draw Signature</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkS, fontSize: 22 }}>×</button>
        </div>
        <canvas ref={cv} width={380} height={150}
          style={{ width: "100%", height: 150, border: `2px solid ${C.border}`, borderRadius: 8, background: "#fff", touchAction: "none", cursor: "crosshair" }}
          onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
          onTouchStart={down} onTouchMove={move} onTouchEnd={up} />
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12 }}>
          <button onClick={clear} style={{ padding: "8px 16px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, fontWeight: 500, color: C.inkS, cursor: "pointer" }}>Clear</button>
          <button onClick={handleSave}
            disabled={empty} style={{ padding: "8px 20px", background: empty ? C.border : C.navy, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: empty ? "not-allowed" : "pointer" }}>Save</button>
        </div>
      </div>
    </div>
  );
}

function TenantModal({ tenant, category, onSave, onClose }) {
  const isEdit = !!tenant;
  const [name, setName] = useState(tenant ? tenant.name : "");
  const [pf, setPf] = useState(tenant ? String(tenant.presentFee) : "");
  const [pmf, setPmf] = useState(tenant ? String(tenant.presentMotherShare != null ? tenant.presentMotherShare : ((Number(tenant.presentFee)||0) - (tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round((Number(tenant.presentFee)||0)*0.7)))) : "");
  const [paf, setPaf] = useState(tenant ? String(tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round((Number(tenant.presentFee)||0)*0.7)) : "");
  const [af, setAf] = useState(tenant ? String(tenant.absentFee) : "");
  const [amf, setAmf] = useState(tenant ? String(tenant.absentMotherShare != null ? tenant.absentMotherShare : ((Number(tenant.absentFee)||0) - (tenant.absentAykaShare != null ? tenant.absentAykaShare : Math.round((Number(tenant.absentFee)||0)*0.7)))) : "");
  const [aaf, setAaf] = useState(tenant ? String(tenant.absentAykaShare != null ? tenant.absentAykaShare : Math.round((Number(tenant.absentFee)||0)*0.7)) : "");
  const [ownerName, setOwnerName] = useState(tenant ? (tenant.ownerName || "") : "");
  const [ownerPhone, setOwnerPhone] = useState(tenant ? (tenant.ownerPhone || "") : "");
  const [startDate, setStartDate] = useState(tenant ? (tenant.startDate || "") : "");
  const [err, setErr] = useState("");

  const handlePfChange = (val) => {
    setPf(val);
    setErr("");
    const num = Number(val) || 0;
    if (num > 0 && (!tenant || tenant.presentAykaShare == null)) {
      const ayka = Math.round(num * 0.7);
      setPaf(String(ayka));
      setPmf(String(num - ayka));
    }
  };

  const handleAfChange = (val) => {
    setAf(val);
    setErr("");
    const num = Number(val) || 0;
    if (num > 0 && (!tenant || tenant.absentAykaShare == null)) {
      const ayka = Math.round(num * 0.7);
      setAaf(String(ayka));
      setAmf(String(num - ayka));
    }
  };

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) { setErr("Enter business name."); return; }
    if (!pf || Number(pf) < 0) { setErr("Enter valid present fee."); return; }
    if (!af || Number(af) < 0) { setErr("Enter valid absent fee."); return; }
    onSave({
      id: tenant ? tenant.id : `${slug(name)}-${Date.now()}`,
      name: name.trim(),
      presentFee: Number(pf),
      presentMotherShare: Number(pmf) || 0,
      presentAykaShare: Number(paf) || 0,
      absentFee: Number(af),
      absentMotherShare: Number(amf) || 0,
      absentAykaShare: Number(aaf) || 0,
      category: tenant ? tenant.category : category,
      ownerName: ownerName.trim(),
      ownerPhone: ownerPhone.trim(),
      startDate: startDate,
    });
  };

  const pSum = (Number(pmf) || 0) + (Number(paf) || 0);
  const pTot = Number(pf) || 0;
  const pDiff = pSum !== pTot;

  const aSum = (Number(amf) || 0) + (Number(aaf) || 0);
  const aTot = Number(af) || 0;
  const aDiff = aSum !== aTot;

  return (

function DayDetailsModal({ day, dateStr, tenant, entry, onSave, onClose }) {
  const [status, setStatus] = useState(entry.status || null);
  const [rent, setRent] = useState(String(entry.rentAmount != null ? entry.rentAmount : (status === "present" ? tenant.presentFee : (status === "absent" ? tenant.absentFee : ""))));
  const [ayka, setAyka] = useState(String(entry.aykaShare != null ? entry.aykaShare : (status === "present" ? (tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round((Number(tenant.presentFee)||0)*0.7)) : (status === "absent" ? (tenant.absentAykaShare != null ? tenant.absentAykaShare : Math.round((Number(tenant.absentFee)||0)*0.7)) : ""))));
  const [mother, setMother] = useState(String(entry.motherShare != null ? entry.motherShare : (status === "present" ? (tenant.presentMotherShare != null ? tenant.presentMotherShare : ((Number(tenant.presentFee)||0)-Number(ayka))) : (status === "absent" ? (tenant.absentMotherShare != null ? tenant.absentMotherShare : ((Number(tenant.absentFee)||0)-Number(ayka))) : ""))));
  const defaultPaid = entry.amountPaid != null ? String(entry.amountPaid) : (entry.signature ? String((Number(rent)||0) + (status === "present" ? GARBAGE : 0)) : "");
  const [amountPaid, setAmountPaid] = useState(defaultPaid);
  const [coveredDate, setCoveredDate] = useState(entry.coveredDate || dateStr);
  const [datePaid, setDatePaid] = useState(entry.datePaid || new Date().toISOString().slice(0, 10));
  const [remarks, setRemarks] = useState(entry.remarks || "");

  const handleStatusSelect = (st) => {
    setStatus(st);
    if (st === "present") {
      const r = tenant.presentFee;
      const a = tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round(r * 0.7);
      const m = tenant.presentMotherShare != null ? tenant.presentMotherShare : (r - a);
      setRent(String(r)); setAyka(String(a)); setMother(String(m));
      if (!amountPaid) setAmountPaid(String(r + GARBAGE));
    } else if (st === "absent") {
      const r = tenant.absentFee;
      const a = tenant.absentAykaShare != null ? tenant.absentAykaShare : Math.round(r * 0.7);
      const m = tenant.absentMotherShare != null ? tenant.absentMotherShare : (r - a);
      setRent(String(r)); setAyka(String(a)); setMother(String(m));
      if (!amountPaid) setAmountPaid(String(r));
    } else {
      setRent(""); setMother(""); setAyka(""); setAmountPaid("");
    }
  };

  const currentTotal = (Number(rent) || 0) + (status === "present" ? GARBAGE : 0);
  const currentPaid = amountPaid !== "" ? Number(amountPaid) : (entry.signature ? currentTotal : 0);
  const currentBal = Math.max(0, currentTotal - currentPaid);

  const submit = (e) => {
    e.preventDefault();
    onSave({
      status: status,
      rentAmount: rent !== "" ? Number(rent) : undefined,
      motherShare: mother !== "" ? Number(mother) : undefined,
      aykaShare: ayka !== "" ? Number(ayka) : undefined,
      amountPaid: amountPaid !== "" ? Number(amountPaid) : undefined,
      coveredDate: coveredDate,
      datePaid: datePaid,
      remarks: remarks.trim()
    });
  };

  return (
    <div className="modal-backdrop" style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 95, padding: 16 }} onClick={onClose}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.ink }}>Edit Entry — Day {day} ({dateStr})</div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.inkS, fontSize: 22 }}>×</button>
        </div>
        <form onSubmit={submit}>
          <div style={{ marginBottom: 14 }}>
            <label style={{ display: "block", fontSize: 11, fontWeight: 700, color: C.inkS, marginBottom: 6, textTransform: "uppercase" }}>Attendance Status</label>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
              <button type="button" onClick={() => handleStatusSelect("present")}
                style={{ padding: "8px", borderRadius: 8, fontSize: 12, fontWeight: 600, border: `1.5px solid ${C.green}`, color: status === "present" ? "#fff" : C.green, background: status === "present" ? C.green : "transparent", cursor: "pointer" }}>✓ Present</button>
              <button type="button" onClick={() => handleStatusSelect("absent")}
                style={{ padding: "8px", borderRadius: 8, fontSize: 12, fontWeight: 600, border: `1.5px solid ${C.navy}`, color: status === "absent" ? "#fff" : C.navy, background: status === "absent" ? C.navy : "transparent", cursor: "pointer" }}>✕ Absent</button>
              <button type="button" onClick={() => handleStatusSelect(null)}
                style={{ padding: "8px", borderRadius: 8, fontSize: 12, fontWeight: 500, border: `1px solid ${C.border}`, color: C.inkS, background: "transparent", cursor: "pointer" }}>Clear</button>
            </div>
          </div>

          <div style={{ padding: 12, border: `1px solid ${C.borderL}`, borderRadius: 10, background: C.paper, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>

                <label style={{ fontSize: 10, fontWeight: 600, color: C.inkS, display: "block", marginBottom: 3 }}>Total Rent</label>

function Ledger({ tenant, onBack, onCustomerView }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [entries, setEntries] = useState({});
  const [signingDate, setSigningDate] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveNote, setSaveNote] = useState("");
  const saveTimer = useRef(null);
  const [useRange, setUseRange] = useState(false);
  const [rangeStart, setRangeStart] = useState(1);
  const [rangeEnd, setRangeEnd] = useState(dim(today.getFullYear(), today.getMonth() + 1));
  const [prevMonthData, setPrevMonthData] = useState(null);

  const storeKey = `entries:${tenant.category}:${tenant.id}:${year}-${pad(month)}`;

  const loadMonth = useCallback(async () => {
    setLoaded(false);
    let localData = {};
    try { const r = await window.storage.get(storeKey); if (r && r.value) { const parsed = JSON.parse(r.value); localData = (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {}; } } catch {}
    setEntries(localData);
    setLoaded(true);


    let pm = month - 1, py = year;
    if (pm < 1) { pm = 12; py--; }
    const prevKey = `entries:${tenant.category}:${tenant.id}:${py}-${pad(pm)}`;
    try {
      let prevEntries = {};
      const pr = await window.storage.get(prevKey).catch(() => null);
      if (pr && pr.value) prevEntries = JSON.parse(pr.value);
      if (!Object.keys(prevEntries).length) {
        const remotePrev = await fetchKeyFromCloud(prevKey);
        if (remotePrev) { prevEntries = remotePrev; window.storage.set(prevKey, JSON.stringify(remotePrev)).catch(() => {}); }
      }
      if (Object.keys(prevEntries).length) {
        const prevDays = dim(py, pm);
        let pTotal = 0, pPresent = 0, pAbsent = 0, pGarb = 0;
        for (let d = 1; d <= prevDays; d++) {
          const e = prevEntries[dk(py, pm, d)] || { status: null };
          const rent = rowRent(e, tenant), garb = rowGarb(e);
          pTotal += rent + garb;
          if (e.status === 'present') pPresent++;
          else if (e.status === 'absent') pAbsent++;
          pGarb += garb;
        }
        setPrevMonthData({ total: pTotal, present: pPresent, absent: pAbsent, garbage: pGarb, days: prevDays, month: MONTHS[pm - 1] });
      } else setPrevMonthData(null);
    } catch { setPrevMonthData(null); }
  }, [storeKey, month, year, tenant]);

  useEffect(() => { loadMonth(); }, [loadMonth]);

  useEffect(() => {
    // True Firebase realtime listener: other devices update this ledger automatically.
    const unsubscribe = window.subscribeKeyFromCloud(storeKey, (remoteData) => {
      if (remoteData) {
        const safeRemote = (remoteData && typeof remoteData === "object" && !Array.isArray(remoteData)) ? remoteData : {};
        setEntries(safeRemote);
        window.storage.set(storeKey, JSON.stringify(safeRemote)).catch(() => {});
        setCloudStatus("synced", "Database updated ✓");
      }
    });
    return () => unsubscribe();
  }, [storeKey]);

  const flash = (msg) => { setSaveNote(msg || "Saved ✓"); clearTimeout(saveTimer.current); saveTimer.current = setTimeout(() => setSaveNote(""), 1400); };
  
  const persist = async (next, changedDay, cloudPatch) => {
    setEntries(next);
    const jsonVal = JSON.stringify(next);
    try { await window.storage.set(storeKey, jsonVal); } catch (err) { console.warn("Local cache error:", err); }
    flash("Saved ✓");
    if (changedDay && typeof window.syncEntryDay === "function") {
      const mutationTime = new Date().toISOString();
      window.syncEntryDay(tenant.category, tenant.id, `${year}-${pad(month)}`, changedDay, cloudPatch || next[changedDay] || {}, mutationTime)
        .then(ok => setCloudStatus(ok ? "synced" : "offline", ok ? "Database Synced ✓" : "Offline — changes will sync automatically"));
    } else {
      autoBackupToCloud(storeKey, jsonVal);
    }
  };

  const getEntry = (d) => (entries && typeof entries === "object" ? entries[dk(year, month, d)] : null) || { status: null, signature: null };
  const dayLabel = (d) => new Date(year, month - 1, d).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" });
  const [editingDay, setEditingDay] = useState(null);
  
  const updateEntry = (d, patch) => {
    const k = dk(year, month, d);
    const existing = getEntry(d);
    if ("status" in patch && patch.status) {
      const p = patch.status === "present";
      patch.rentAmount = p ? tenant.presentFee : tenant.absentFee;
      patch.aykaShare = p
        ? (tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round((Number(tenant.presentFee)||0)*0.7))
        : (tenant.absentAykaShare != null ? tenant.absentAykaShare : Math.round((Number(tenant.absentFee)||0)*0.7));
      patch.motherShare = p
        ? (tenant.presentMotherShare != null ? tenant.presentMotherShare : ((Number(tenant.presentFee)||0) - patch.aykaShare))
        : (tenant.absentMotherShare != null ? tenant.absentMotherShare : ((Number(tenant.absentFee)||0) - patch.aykaShare));
    }
    if ("status" in patch && !patch.status) {
      patch.rentAmount = undefined;
      patch.motherShare = undefined;
      patch.aykaShare = undefined;
    }
    persist({ ...entries, [k]: { ...existing, ...patch } }, k, patch);
    if ("status" in patch) {
      const action = patch.status === "present" ? "Marked Present" : patch.status === "absent" ? "Marked Absent" : "Cleared status";
      window.logActivity(action, `${tenant.name} — ${dayLabel(d)}`);
    }
    if ("signature" in patch) {
      window.logActivity(patch.signature ? "Signature saved" : "Signature cleared", `${tenant.name} — ${dayLabel(d)}`);
    }
  };

  const guardedUpdate = (d, patch) => {
    if (getEntry(d).signature) {
      if (!window.confirm("This day already has a signature on file. Changing it now will alter a signed record. Continue?")) return;
    }
    updateEntry(d, patch);
  };
  const changeMonth = (delta) => { let m = month + delta, y = year; if (m > 12) { m = 1; y++; } else if (m < 1) { m = 12; y--; } setMonth(m); setYear(y); setRangeStart(1); setRangeEnd(dim(y, m)); };

  const numDays = dim(year, month);
  const days = Array.from({ length: numDays }, (_, i) => i + 1);
  
  let totalDue = 0, presentC = 0, absentC = 0, signedC = 0;
  let totalRentSum = 0, totalMotherSum = 0, totalAykaSum = 0, totalGarbSum = 0, totalPaidSum = 0, totalBalSum = 0;
  days.forEach((d) => {
    const e = getEntry(d);
    const rent = rowRent(e, tenant);
    const mother = rowMother(e, tenant);
    const ayka = rowAyka(e, tenant);
    const garb = rowGarb(e);
    const pd = rowPaid(e, tenant);
    const bl = rowBal(e, tenant);
    if (e.signature) { totalDue += rowTot(e, tenant); }
    if (e.status === "present" || e.status === "absent") {
      if (e.status === "present") presentC++; else absentC++;
      totalRentSum += rent;
      totalMotherSum += mother;
      totalAykaSum += ayka;
      totalPaidSum += pd;
      totalBalSum += bl;
    }
    totalGarbSum += garb;
    if (e.signature) signedC++;
  });

  const rangeDays = days.filter((d) => d >= rangeStart && d <= rangeEnd);
  let rangeTotal = 0, rangePresentC = 0, rangeAbsentC = 0;
  let rangeRentSum = 0, rangeMotherSum = 0, rangeAykaSum = 0, rangeGarbSum = 0;
  rangeDays.forEach((d) => {
    const e = getEntry(d);
    const rent = rowRent(e, tenant), mother = rowMother(e, tenant), ayka = rowAyka(e, tenant), garb = rowGarb(e);
    if (e.signature) { rangeTotal += rowTot(e, tenant); }
    if (e.status === "present" || e.status === "absent") {
      if (e.status === "present") rangePresentC++; else rangeAbsentC++;
      rangeRentSum += rent;
      rangeMotherSum += mother;
      rangeAykaSum += ayka;
    }
    rangeGarbSum += garb;
  });

  const downloadPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pw = 210, ph = 297, ml = 14, mr = 14, contentW = pw - ml - mr;
    let y = 18;

    doc.setTextColor(27, 42, 74);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("BANAHAW FOOD PARK", pw / 2, y, { align: "center" });
    y += 6;
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(120, 115, 105);
    doc.text("Brgy. Ibabang Iyam, Lucena City", pw / 2, y, { align: "center" });

    y += 5;
    doc.setDrawColor(27, 42, 74);
    doc.setLineWidth(0.6);
    doc.line(ml, y, pw - mr, y);
    y += 8;

    doc.setTextColor(27, 42, 74);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text(`RENT LEDGER ${useRange ? MONTHS[month - 1].slice(0, 3) + ' ' + rangeStart + ' - ' + MONTHS[month - 1].slice(0, 3) + ' ' + rangeEnd : MONTHS[month - 1]} ${year}`, pw / 2, y, { align: "center" });
    y += 8;

    doc.setFontSize(8.5);
    doc.setTextColor(80, 75, 65);
    const lbl = (label, val, x, yy) => {
      doc.setFont("helvetica", "bold");
      doc.text(label, x, yy);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(40, 40, 40);
      doc.text(String(val), x + doc.getTextWidth(label) + 2, yy);
      doc.setTextColor(80, 75, 65);
    };
    lbl("TENANT:", tenant.name, ml, y);
    const catLabel = categoryLabel(tenant.category);
    lbl("  |  TYPE:", catLabel, ml + 70, y);
    y += 5;
    lbl("PRESENT FEE:", `${Number(tenant.presentFee).toFixed(2)} (Ayka: ${Number(tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round(tenant.presentFee*0.7)).toFixed(2)}, Mother: ${Number(tenant.presentMotherShare != null ? tenant.presentMotherShare : (tenant.presentFee - Math.round(tenant.presentFee*0.7))).toFixed(2)})`, ml, y);
    y += 8;

    const pdfDays = useRange ? days.filter((d) => d >= rangeStart && d <= rangeEnd) : days;
    const sigImages = {};

    let pdfRentTotal = 0, pdfMotherTotal = 0, pdfAykaTotal = 0, pdfGarbTotal = 0, pdfGrandTotal = 0;

    const rows = pdfDays.map((d) => {
      const e = getEntry(d);
      const dObj = new Date(year, month - 1, d);
      const wd = dObj.toLocaleDateString("en-PH", { weekday: "short" });
      const rent = rowRent(e, tenant);
      const mother = rowMother(e, tenant);
      const ayka = rowAyka(e, tenant);
      const garb = rowGarb(e);
      const tot = rowTot(e, tenant);

      if (e.status) {
        pdfRentTotal += rent;
        pdfMotherTotal += mother;
        pdfAykaTotal += ayka;
      }
      pdfGarbTotal += garb;
      if (e.status) pdfGrandTotal += tot;

      let rmk = e.remarks || (e.status === "present" ? "Present" : e.status === "absent" ? "Absent" : "");
      if (e.datePaid && e.datePaid !== dk(year, month, d)) {
        rmk = `[Paid ${e.datePaid}] ${rmk}`.trim();
      }
      if (e.signature) sigImages[d] = e.signature;

      return [
        `${MONTHS[month - 1].slice(0, 3)} ${d}`,
        wd,
        e.status ? e.status.toUpperCase() : "—",
        rent > 0 ? Number(rent).toFixed(2) : "",
        ayka > 0 ? Number(ayka).toFixed(2) : "",
        mother > 0 ? Number(mother).toFixed(2) : "",
        garb > 0 ? Number(garb).toFixed(2) : "",
        tot > 0 ? Number(tot).toFixed(2) : "",
        rmk,
        e.signature ? "signed" : "",
      ];
    });

    rows.push([
      "TOTALS",
      "",
      `${presentC}P / ${absentC}A`,
      Number(pdfRentTotal).toFixed(2),
      Number(pdfAykaTotal).toFixed(2),
      Number(pdfMotherTotal).toFixed(2),
      Number(pdfGarbTotal).toFixed(2),
      Number(pdfGrandTotal).toFixed(2),
      "",
      `${signedC}/${pdfDays.length}`
    ]);

    doc.autoTable({
      startY: y, margin: { left: ml, right: mr },
      head: [["DATE", "DAY", "STATUS", "RENT", "AYKA", "MOTHER", "TOTAL", "REMARKS", "SIGNATURE"]],
      body: rows,
      styles: { fontSize: 7.5, cellPadding: { top: 2.5, bottom: 2.5, left: 3, right: 3 }, textColor: [50, 50, 50], lineColor: [215, 210, 200], lineWidth: 0.2, font: "helvetica" },
      headStyles: { fillColor: [27, 42, 74], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7 },
      alternateRowStyles: { fillColor: [248, 246, 240] },
      columnStyles: {
        0: { cellWidth: 18 },
        1: { cellWidth: 12 },
        2: { cellWidth: 16 },
        3: { halign: "right", cellWidth: 18 },
        4: { halign: "right", cellWidth: 18 },
        5: { halign: "right", cellWidth: 18 },
        6: { halign: "right", cellWidth: 20, fontStyle: "bold" },
        7: { cellWidth: 26 },
        8: { cellWidth: 21, halign: "center" }
      },
      didDrawCell: function(data) {
        if (data.column.index === 8 && data.section === 'body' && data.row.index < pdfDays.length) {
          const dayNum = pdfDays[data.row.index];
          if (dayNum && sigImages[dayNum]) {
            try {
              const cellX = data.cell.x + 1;
              const cellY = data.cell.y + 1;
              const cellW = data.cell.width - 2;
              const cellH = data.cell.height - 2;
              doc.addImage(sigImages[dayNum], 'PNG', cellX, cellY, cellW, cellH);
            } catch (err) {}
          }
        }
      }
    });

    let fy = doc.lastAutoTable.finalY || y;
    fy += 6;
    doc.setDrawColor(27, 42, 74);
    doc.setLineWidth(0.5);
    doc.line(ml, fy, pw - mr, fy);
    fy += 6;

    doc.setFontSize(8.5);
    doc.setTextColor(60, 60, 60);
    doc.setFont("helvetica", "bold");
    doc.text("SUMMARY BREAKDOWN", ml, fy);
    fy += 6;

    doc.setFillColor(248, 246, 240);
    doc.roundedRect(ml, fy, contentW, 22, 2, 2, "F");
    doc.setDrawColor(220, 215, 200);
    doc.roundedRect(ml, fy, contentW, 22, 2, 2, "S");

    const bx = ml + 6, by = fy + 6;
    doc.setFontSize(7.5);
    doc.setTextColor(100, 95, 85);
    doc.setFont("helvetica", "bold");
    doc.text("TOTAL RENT:", bx, by);
    doc.text("ATE AYKA SHARE:", bx + 50, by);
    doc.text("MOTHER SHARE:", bx + 100, by);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(40, 40, 40);
    doc.text(Number(pdfRentTotal).toFixed(2), bx, by + 4);
    doc.text(Number(pdfAykaTotal).toFixed(2), bx + 50, by + 4);
    doc.text(Number(pdfMotherTotal).toFixed(2), bx + 100, by + 4);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.setTextColor(27, 42, 74);
    doc.text(`GRAND TOTAL DUE: P${Number(pdfGrandTotal).toFixed(2)}`, bx, by + 12);
    fy += 26;

    fy += 8;
    doc.setDrawColor(180, 175, 168);
    doc.setLineWidth(0.3);
    doc.line(ml, fy, ml + 60, fy);
    doc.line(pw - mr - 60, fy, pw - mr, fy);
    fy += 4;
    doc.setFontSize(7.5);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(140, 135, 125);
    doc.text("Authorized Signature", ml, fy);
    doc.text("Tenant Signature", pw - mr - 60, fy);

    doc.setFontSize(7);
    doc.setTextColor(180, 175, 168);
    doc.text("Banahaw Food Park  |  Brgy. Ibabang Iyam, Lucena City", ml, ph - 10);
    doc.text(`${new Date().toLocaleDateString("en-PH")} ${new Date().toLocaleTimeString("en-PH")}`, pw - mr, ph - 10, { align: "right" });

    const sn = tenant.name.replace(/[^a-zA-Z0-9]/g, "_");
    doc.save(`${sn}_${MONTHS[month - 1]}_${year}_Ledger.pdf`);
  };

  return (
    <div style={{ minHeight: "100vh", background: C.paper, paddingBottom: 80 }}>
      <div style={{ background: `linear-gradient(135deg, ${C.navy} 0%, ${C.navyL} 100%)`, color: "#fff", padding: "24px 20px 18px" }}>
        <div style={{ maxWidth: 960, margin: "0 auto" }}>
          <button onClick={onBack} style={{ background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.18)", borderRadius: 8, padding: "6px 12px", color: "#fff", fontSize: 13, cursor: "pointer", marginBottom: 12 }}>← Back to Tenants</button>
          <div style={{ fontSize: 22, fontWeight: 700 }}>{tenant.name}</div>
          <div style={{ fontSize: 12, opacity: 0.7, marginTop: 4 }}>
            {categoryLabel(tenant.category)} · Present {peso(tenant.presentFee)} (Ayka {peso(tenant.presentAykaShare != null ? tenant.presentAykaShare : Math.round(tenant.presentFee*0.7))} / Mother {peso(tenant.presentMotherShare != null ? tenant.presentMotherShare : (tenant.presentFee - Math.round(tenant.presentFee*0.7)))}) · Garbage {peso(GARBAGE)}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 960, margin: "0 auto", padding: "20px 20px 0" }}>
        {/* Top Summary Cards */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 18 }}>
          <div className="fade-in" style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.inkS, textTransform: "uppercase", letterSpacing: 0.5 }}>Total Rent</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.navy, marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>{peso(totalRentSum)}</div>
          </div>
          <div className="fade-in" style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.gold, textTransform: "uppercase", letterSpacing: 0.5 }}>Kay Ate Ayka Share</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.gold, marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>{peso(totalAykaSum)}</div>
          </div>
          <div className="fade-in" style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.navy, textTransform: "uppercase", letterSpacing: 0.5 }}>Sinusulit kay Mother</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.navy, marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>{peso(totalMotherSum)}</div>
          </div>
          <div className="fade-in" style={{ background: `linear-gradient(135deg, ${C.navy} 0%, ${C.navyL} 100%)`, color: "#fff", borderRadius: 10, padding: "12px 14px", boxShadow: "0 2px 8px rgba(27,42,74,0.2)" }}>
            <div style={{ fontSize: 10, fontWeight: 700, opacity: 0.8, textTransform: "uppercase", letterSpacing: 0.5 }}>Grand Total</div>
            <div style={{ fontSize: 20, fontWeight: 700, marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>{peso(totalDue)}</div>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
          <button onClick={() => changeMonth(-1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer", color: C.ink }}>‹</button>
          <span className="fade-in" style={{ fontSize: 18, fontWeight: 700, minWidth: 170, textAlign: "center", fontFamily: "'DM Serif Display', Georgia, serif", color: C.navy }}>{MONTHS[month - 1]} {year}</span>
          <button onClick={() => changeMonth(1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer", color: C.ink }}>›</button>
          <button onClick={() => onCustomerView && onCustomerView(tenant)} className="btn-hover" style={{ padding: "8px 14px", background: C.navy, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>✍️ Customer View</button>
          <button onClick={downloadPdf} className="btn-hover ripple" style={{ padding: "8px 16px", background: C.gold, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>📥 PDF</button>
        </div>

        <div className="fade-in" style={{ marginBottom: 16 }}>
          <button onClick={() => { setUseRange(!useRange); if (!useRange) { setRangeStart(1); setRangeEnd(numDays); } }}
            className="btn-hover"
            style={{ padding: "8px 16px", background: useRange ? C.navy : '#fff', color: useRange ? '#fff' : C.ink, border: `1px solid ${useRange ? C.navy : C.border}`, borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
            {useRange ? '✓ ' : '📅 '} Date Range Filter
          </button>
          {useRange && (
            <div className="slide-up" style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', padding: '12px 16px', background: '#fff', border: `1px solid ${C.borderL}`, borderRadius: 10 }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>From:</span>
              <select value={rangeStart} onChange={(e) => { const v = Number(e.target.value); setRangeStart(v); if (v > rangeEnd) setRangeEnd(v); }}
                className="input-glow" style={{ padding: '7px 10px', border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, background: '#fff', color: C.ink }}>
                {days.map((d) => <option key={d} value={d}>{MONTHS[month - 1].slice(0, 3)} {d}</option>)}
              </select>
              <span style={{ fontSize: 13, color: C.inkS }}>→</span>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>To:</span>
              <select value={rangeEnd} onChange={(e) => { const v = Number(e.target.value); setRangeEnd(v); if (v < rangeStart) setRangeStart(v); }}
                className="input-glow" style={{ padding: '7px 10px', border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, background: '#fff', color: C.ink }}>
                {days.filter((d) => d >= rangeStart).map((d) => <option key={d} value={d}>{MONTHS[month - 1].slice(0, 3)} {d}</option>)}
              </select>
              <span style={{ fontSize: 12, color: C.inkS, marginLeft: 4 }}>{rangeDays.length} day{rangeDays.length !== 1 ? 's' : ''}</span>
            </div>
          )}
        </div>

        <div style={{ background: '#fff', border: `1px solid ${C.borderL}`, borderRadius: 12, overflow: 'hidden', boxShadow: '0 1px 4px rgba(0,0,0,0.05)' }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 800 }}>
              <thead>
                <tr style={{ background: C.navy, color: "#fff", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.6 }}>
                  <th style={{ padding: "12px 10px", textAlign: "left" }}>Date</th>
                  <th style={{ padding: "12px 10px", textAlign: "center" }}>Status</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Total Rent</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Kay Ate Ayka</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Sinusulit kay Mother</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Total Due</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Amount Paid</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Balance</th>
                  <th style={{ padding: "12px 10px", textAlign: "left" }}>Remarks</th>
                  <th style={{ padding: "12px 10px", textAlign: "center" }}>Signature</th>
                </tr>
              </thead>
              <tbody>
                {loaded && days.map((day, idx) => {
                  const e = getEntry(day);
                  const dObj = new Date(year, month - 1, day);
                  const dateStr = dk(year, month, day);
                  const wd = dObj.toLocaleDateString("en-PH", { weekday: "short" });
                  const isToday = dObj.toDateString() === today.toDateString();
                  const isWknd = dObj.getDay() === 0 || dObj.getDay() === 6;
                  const isInRange = useRange && day >= rangeStart && day <= rangeEnd;
                  const rent = rowRent(e, tenant), mother = rowMother(e, tenant), ayka = rowAyka(e, tenant), tot = rowTot(e, tenant);
                  const pd = rowPaid(e, tenant), bl = rowBal(e, tenant);
                  const hasPaidDiffDate = e.datePaid && e.datePaid !== dateStr;
                  return (
                    <tr key={day} className="table-row" style={{ background: isInRange ? 'rgba(197,150,26,0.08)' : isToday ? 'rgba(197,150,26,0.05)' : idx % 2 ? '#fff' : C.paperAlt, borderTop: `1px solid ${C.borderL}`, borderLeft: isInRange ? '3px solid #C5961A' : '3px solid transparent' }}>
                      <td style={{ padding: "10px 10px" }}>
                        <div style={{ fontWeight: 600, fontSize: 14, display: "flex", alignItems: "center", gap: 6 }}>
                          <span>{day}</span>
                          <button onClick={() => setEditingDay(day)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: C.inkS, padding: 0 }} title="Edit entry breakdown & remarks">✏️</button>
                        </div>
                        <div style={{ fontSize: 11, color: isWknd ? C.navy : C.inkS, fontWeight: 500 }}>{wd}</div>
                        {isToday && <div style={{ fontSize: 10, color: C.gold, fontWeight: 600, marginTop: 1 }}>TODAY</div>}
                      </td>
                      <td style={{ padding: "8px 8px", textAlign: "center" }}>
                        <div style={{ display: "flex", justifyContent: "center", gap: 4 }}>
                          <button onClick={() => guardedUpdate(day, { status: e.status === "present" ? null : "present" })} className="btn-hover"
                            style={{ padding: "4px 8px", fontSize: 11, fontWeight: 600, border: `1.5px solid ${C.green}`, color: e.status === "present" ? "#fff" : C.green, background: e.status === "present" ? C.green : "transparent", borderRadius: 6, cursor: "pointer" }}>✓ Present</button>
                          <button onClick={() => guardedUpdate(day, { status: e.status === "absent" ? null : "absent" })} className="btn-hover"
                            style={{ padding: "4px 8px", fontSize: 11, fontWeight: 600, border: `1.5px solid ${C.navy}`, color: e.status === "absent" ? "#fff" : C.navy, background: e.status === "absent" ? C.navy : "transparent", borderRadius: 6, cursor: "pointer" }}>✕ Absent</button>
                        </div>
                      </td>
                      <td style={{ padding: "8px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: rent > 0 ? C.ink : C.border }}>{e.status ? peso(rent) : "—"}</td>
                      <td style={{ padding: "8px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: ayka > 0 ? C.gold : C.border }}>{e.status ? peso(ayka) : "—"}</td>

function formatLogTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("en-PH", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}
