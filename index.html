function CategoryReport({ category, onBack }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [tenants, setTenants] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [useDateRange, setUseDateRange] = useState(false);
  const [fromDay, setFromDay] = useState(1);
  const [toDay, setToDay] = useState(today.getDate());
  const [showPerDay, setShowPerDay] = useState(false);
  const [expandedTenant, setExpandedTenant] = useState(null);

  useEffect(() => {
    let alive = true;
    const key = `tenants:${category}`;
    (async () => {
      try {
        const cloud = await fetchKeyFromCloud(key);
        if (alive && Array.isArray(cloud)) {
          setTenants(cloud);
          await window.storage.set(key, JSON.stringify(cloud)).catch(() => {});
        } else {
          const r = await window.storage.get(key).catch(() => null);
          if (alive) setTenants(r && r.value ? JSON.parse(r.value) : []);
        }
      } catch (ex) {
        try {
          const r = await window.storage.get(key);
          if (alive) setTenants(r && r.value ? JSON.parse(r.value) : []);
        } catch (_) { if (alive) setTenants([]); }
      }
      if (alive) setLoaded(true);
    })();
    const unsubscribe = window.subscribeKeyFromCloud(key, remote => {
      if (!alive) return;
      const list = Array.isArray(remote) ? remote : [];
      setTenants(list);
      window.storage.set(key, JSON.stringify(list)).catch(() => {});
      setLoaded(true);
    });
    return () => { alive = false; unsubscribe(); };
  }, [category]);

  const numDays = dim(year, month);
  const days = Array.from({ length: numDays }, (_, i) => i + 1);
  const activeDays = useDateRange ? days.filter(function(d) { return d >= fromDay && d <= toDay; }) : days;

  const getEntries = async (tenant) => {
    const key = `entries:${tenant.category}:${tenant.id}:${year}-${pad(month)}`;
    let localData = {};
    try {
      const r = await window.storage.get(key);
      if (r && r.value) { const parsed = JSON.parse(r.value); localData = (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {}; }
    } catch (ex) {}
    try {
      const cloudData = await fetchKeyFromCloud(key);
      if (cloudData && typeof cloudData === "object") {
        localData = cloudData;
        window.storage.set(key, JSON.stringify(localData)).catch(function(){});
      }
    } catch(e) {}
    return localData || {};
  };

  const [tenantTotals, setTenantTotals] = useState([]);

  useEffect(() => {
    if (!loaded || tenants.length === 0) return;
    (async () => {
      const results = [];
      var tenantsList = tenants;
      for (var ti = 0; ti < tenantsList.length; ti++) {
        var t = tenantsList[ti];
        const entries = await getEntries(t);
        var presentC = 0, absentC = 0, signedC = 0;
        var rentSum = 0, aykaSum = 0, motherSum = 0, garbSum = 0, totalDue = 0, paidSum = 0, balSum = 0;
        var dayData = [];
        activeDays.forEach(function(d) {
          const e = entries[dk(year, month, d)] || { status: null, signature: null };
          const rent = rowRent(e, t);
          const ayka = rowAyka(e, t);
          const mother = rowMother(e, t);
          const garb = rowGarb(e);
          const tot = rent + garb;
          const paid = rowPaid(e, t);
          const bal = rowBal(e, t);

          if (e.status === "present") presentC++;
          else if (e.status === "absent") absentC++;
          if (e.signature) signedC++;

          if (e.status) {
            rentSum += rent;
            aykaSum += ayka;
            motherSum += mother;
            garbSum += garb;
            totalDue += tot;
            paidSum += paid;
            balSum += bal;
          }

          const dObj = new Date(year, month - 1, d);
          dayData.push({
            day: d,
            weekday: dObj.toLocaleDateString("en-PH", { weekday: "short" }),
            status: e.status,
            rent: rent,
            ayka: ayka,
            mother: mother,
            garb: garb,
            total: tot,
            paid: paid,
            bal: bal,
            signed: !!e.signature,
            signature: e.signature || null,
            coveredDate: e.coveredDate || "",
            datePaid: e.datePaid || "",
            remarks: e.remarks || ""
          });
        });
        results.push({
          ...t,
          presentC, absentC, signedC,
          rentSum, aykaSum, motherSum, garbSum, totalDue, paidSum, balSum,
          days: activeDays.length, dayData
        });
      }
      setTenantTotals(results);
    })();
  }, [loaded, tenants, year, month, fromDay, toDay, useDateRange]);

  const grandTotal = tenantTotals.reduce((s, t) => s + t.totalDue, 0);
  const grandAyka = tenantTotals.reduce((s, t) => s + t.aykaSum, 0);
  const grandMother = tenantTotals.reduce((s, t) => s + t.motherSum, 0);
  const grandGarb = tenantTotals.reduce((s, t) => s + t.garbSum, 0);
  const grandPaid = tenantTotals.reduce((s, t) => s + t.paidSum, 0);
  const grandBal = tenantTotals.reduce((s, t) => s + t.balSum, 0);
  const totalPresent = tenantTotals.reduce((s, t) => s + t.presentC, 0);
  const totalAbsent = tenantTotals.reduce((s, t) => s + t.absentC, 0);

  const downloadCategoryPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pw = 210, ph = 297, ml = 10, mr = 10, contentW = pw - ml - mr;
    let y = 13;
    const periodText = useDateRange ? `${MONTHS[month - 1]} ${fromDay}-${toDay}, ${year}` : `${MONTHS[month - 1]} ${year}`;

    doc.setTextColor(27, 42, 74); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text("BANAHAW FOOD PARK", pw / 2, y, { align: "center" });
    y += 5; doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 95, 85);
    doc.text("Brgy. Ibabang Iyam, Lucena City", pw / 2, y, { align: "center" });
    y += 5; doc.setDrawColor(27, 42, 74); doc.setLineWidth(0.5); doc.line(ml, y, pw - mr, y); y += 7;
    doc.setTextColor(27, 42, 74); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
    doc.text(`${categoryLabel(category).toUpperCase()} — CATEGORY REPORT`, pw / 2, y, { align: "center" });
    y += 5; doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(80, 75, 65);
    doc.text(`Coverage: ${periodText}`, pw / 2, y, { align: "center" }); y += 8;

    const summaryRows = tenantTotals.map((t, i) => [i + 1, t.name, t.presentC, t.absentC, pesoPdf(t.totalDue), pesoPdf(t.paidSum), pesoPdf(t.balSum)]);
    summaryRows.push(["", `GRAND TOTAL (${tenantTotals.length} TENANTS)`, totalPresent, totalAbsent, pesoPdf(grandTotal), pesoPdf(grandPaid), pesoPdf(grandBal)]);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(27, 42, 74); doc.text("SUMMARY", ml, y); y += 4;
    doc.autoTable({
      startY:y, margin:{left:ml,right:mr}, head:[["#","Business Name","P","A","Total Due","Paid","Balance"]], body:summaryRows,
      styles:{fontSize:7.2,cellPadding:2.2,overflow:"linebreak"}, headStyles:{fillColor:[27,42,74],textColor:[255,255,255],fontStyle:"bold",fontSize:7}, alternateRowStyles:{fillColor:[248,246,240]},
      columnStyles:{0:{cellWidth:8,halign:"center"},1:{cellWidth:62},2:{cellWidth:12,halign:"center"},3:{cellWidth:12,halign:"center"},4:{cellWidth:29,halign:"right"},5:{cellWidth:29,halign:"right"},6:{cellWidth:29,halign:"right"}},
      didParseCell:function(data){if(data.row.index===summaryRows.length-1){data.cell.styles.fontStyle="bold";data.cell.styles.fillColor=[245,223,160];}}
    });
    y=(doc.lastAutoTable.finalY||y)+7;

    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(27,42,74); doc.text("FILTERED TOTALS",ml,y); y+=5;
    const metricW=contentW/3;
    [["TOTAL DUE",grandTotal],["TOTAL PAID",grandPaid],["BALANCE",grandBal]].forEach((m,i)=>{
      const x=ml+i*metricW; doc.setFillColor(248,246,240); doc.roundedRect(x+1,y,metricW-3,16,2,2,"F");
      doc.setFont("helvetica","bold"); doc.setFontSize(6.5); doc.setTextColor(90,85,75); doc.text(m[0],x+4,y+5);
      doc.setFontSize(9); doc.setTextColor(27,42,74); doc.text(pesoPdf(m[1]),x+4,y+11);
    }); y+=22;

    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(27,42,74); doc.text(`PER DAY DETAIL — ${periodText}`,ml,y); y+=4;
    const detailRows=[];
    tenantTotals.forEach(t=>t.dayData.forEach(dd=>detailRows.push({tenant:t.name,day:`${MONTHS[month-1].slice(0,3)} ${dd.day}`,status:dd.status?(dd.status==="present"?"Present":"Absent"):"—",due:dd.total,paid:dd.paid,bal:dd.bal,covered:dd.coveredDate||"—",paidDate:dd.datePaid||"—",remarks:dd.remarks||"—",signature:dd.signature||null})));
    if(!detailRows.length){doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(100,95,85);doc.text("No recorded entries for the selected date range.",ml,y+5);}
    else {
      const body=detailRows.map(r=>[r.tenant,r.day,r.status,pesoPdf(r.due),pesoPdf(r.paid),pesoPdf(r.bal),r.covered,r.paidDate,r.remarks,r.signature?"":"—"]);
      doc.autoTable({
        startY:y, margin:{left:ml,right:mr,top:10,bottom:15}, head:[["Tenant","Date","Status","Due","Paid","Bal.","Covered","Paid Date","Remarks","Sign"]], body:body,
        styles:{fontSize:5.5,cellPadding:1.5,overflow:"linebreak",valign:"middle"}, headStyles:{fillColor:[27,42,74],textColor:[255,255,255],fontStyle:"bold",fontSize:5.7},
        columnStyles:{0:{cellWidth:30},1:{cellWidth:15},2:{cellWidth:14,halign:"center"},3:{cellWidth:18,halign:"right"},4:{cellWidth:18,halign:"right"},5:{cellWidth:18,halign:"right"},6:{cellWidth:19},7:{cellWidth:19},8:{cellWidth:28},9:{cellWidth:11,halign:"center"}},
        didParseCell:function(data){if(data.section==="body"&&data.column.index===9)data.cell.styles.minCellHeight=11;},
        didDrawCell:function(data){if(data.section==="body"&&data.column.index===9){const item=detailRows[data.row.index];if(item&&item.signature){try{doc.addImage(item.signature,"PNG",data.cell.x+1,data.cell.y+1,data.cell.width-2,Math.min(8,data.cell.height-2));}catch(e){}}}}
      });
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(140,135,125);
    doc.text("This report reflects the selected date range only. Signatures shown are the signatures recorded for the corresponding entry.",ml,ph-12);
    doc.text("Banahaw Food Park | Brgy. Ibabang Iyam, Lucena City",ml,ph-7); doc.text(new Date().toLocaleDateString("en-PH"),pw-mr,ph-7,{align:"right"});
    const rangeSuffix=useDateRange?`_Day${fromDay}-${toDay}`:"_FullMonth";
    doc.save(`${categoryLabel(category)}_${MONTHS[month-1]}_${year}_CategoryReport${rangeSuffix}.pdf`);
  };

  const changeMonth = (delta) => { let m = month + delta, y = year; if (m > 12) { m = 1; y++; } else if (m < 1) { m = 12; y--; } setMonth(m); setYear(y); setFromDay(1); setToDay(dim(y, m)); };

  return (
    <div style={{ minHeight: "100vh", background: C.paper }}>
      <div style={{ background: `linear-gradient(135deg, ${C.navy} 0%, ${C.navyL} 100%)`, color: "#fff", padding: "24px 20px" }}>
        <div style={{ maxWidth: 960, margin: "0 auto" }}>
          <button onClick={onBack} style={{ background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.18)", borderRadius: 8, padding: "6px 12px", color: "#fff", fontSize: 13, cursor: "pointer", marginBottom: 12 }}>← Back</button>
          <div style={{ fontSize: 22, fontWeight: 700 }}>{categoryLabel(category)} — Category Report</div>
          <div style={{ fontSize: 12, opacity: 0.65, marginTop: 4 }}>Total payment per tenant for the month</div>
        </div>
      </div>
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "20px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
          <button onClick={() => changeMonth(-1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>‹</button>
          <span style={{ fontSize: 18, fontWeight: 700, minWidth: 170, textAlign: "center", fontFamily: "'DM Serif Display', Georgia, serif", color: C.navy }}>{MONTHS[month - 1]} {year}</span>
          <button onClick={() => changeMonth(1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>›</button>
          <button onClick={downloadCategoryPdf} className="btn-hover ripple" style={{ padding: "8px 16px", background: C.gold, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>📥 Download PDF</button>
        </div>

        <div style={{ marginBottom: 16, display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', justifyContent: 'center' }}>
          <button onClick={() => { setUseDateRange(!useDateRange); if (!useDateRange) { setFromDay(1); setToDay(numDays); } }} className="btn-hover"
            style={{ padding: '8px 16px', background: useDateRange ? C.navy : '#fff', color: useDateRange ? '#fff' : C.ink, border: `1px solid ${useDateRange ? C.navy : C.border}`, borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
            {useDateRange ? 'Done ' : 'Select Days'}
          </button>
          <button onClick={() => setShowPerDay(!showPerDay)} className="btn-hover"
            style={{ padding: '8px 16px', background: showPerDay ? C.gold : '#fff', color: showPerDay ? '#fff' : C.ink, border: `1px solid ${showPerDay ? C.gold : C.border}`, borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
            {showPerDay ? 'Hide ' : 'Per Day'}
          </button>
        </div>
        {useDateRange && (
          <div className="slide-up" style={{ marginBottom: 16, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', padding: '12px 16px', background: '#fff', border: `1px solid ${C.borderL}`, borderRadius: 10, justifyContent: 'center' }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>From:</span>
            <select value={fromDay} onChange={(e) => { const v = Number(e.target.value); setFromDay(v); if (v > toDay) setToDay(v); }}
              style={{ padding: '7px 10px', border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, background: '#fff', color: C.ink }}>
              {days.map(function(d) { return <option key={d} value={d}>{MONTHS[month-1].slice(0,3)} {d}</option>; })}
            </select>
            <span style={{ fontSize: 13, color: C.inkS }}>→</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>To:</span>
            <select value={toDay} onChange={(e) => { const v = Number(e.target.value); setToDay(v); if (v < fromDay) setFromDay(v); }}
              style={{ padding: '7px 10px', border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, background: '#fff', color: C.ink }}>
              {days.filter(function(d) { return d >= fromDay; }).map(function(d) { return <option key={d} value={d}>{MONTHS[month-1].slice(0,3)} {d}</option>; })}
            </select>
            <span style={{ fontSize: 12, color: C.inkS }}>{activeDays.length} day{activeDays.length !== 1 ? 's' : ''}</span>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginBottom: 20 }}>
          <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: C.inkS, textTransform: "uppercase" }}>Total Due</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.navy, fontFamily: "'JetBrains Mono', monospace" }}>{peso(grandTotal)}</div>
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: C.gold, textTransform: "uppercase" }}>Ate Ayka Share</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.gold, fontFamily: "'JetBrains Mono', monospace" }}>{peso(grandAyka)}</div>
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: C.navy, textTransform: "uppercase" }}>Mother Share</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.navy, fontFamily: "'JetBrains Mono', monospace" }}>{peso(grandMother)}</div>
          </div>
          <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: C.green, textTransform: "uppercase" }}>Total Paid</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.green, fontFamily: "'JetBrains Mono', monospace" }}>{peso(grandPaid)}</div>
          </div>
          <div style={{ background: grandBal > 0 ? C.redBg : "#fff", border: `1px solid ${grandBal > 0 ? C.red : C.borderL}`, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: grandBal > 0 ? C.red : C.inkS, textTransform: "uppercase" }}>Remaining Balance</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: grandBal > 0 ? C.red : C.navy, fontFamily: "'JetBrains Mono', monospace" }}>{peso(grandBal)}</div>
          </div>
        </div>

        <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 12, overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 700 }}>
              <thead>
                <tr style={{ background: C.navy, color: "#fff", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.6 }}>
                  <th style={{ padding: "12px 10px", textAlign: "left" }}>#</th>
                  <th style={{ padding: "12px 10px", textAlign: "left" }}>Business Name</th>
                  <th style={{ padding: "12px 10px", textAlign: "center" }}>Attendance</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Ate Ayka Share</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Mother Share</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Total Due</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Amount Paid</th>
                  <th style={{ padding: "12px 10px", textAlign: "right" }}>Balance</th>
                </tr>
              </thead>
              <tbody>
                {tenantTotals.map((t, i) => (
                  <tr key={t.id} className="table-row" style={{ background: i % 2 ? C.paperAlt : "#fff", borderTop: `1px solid ${C.borderL}` }}>
                    <td style={{ padding: "10px 10px", fontSize: 13, color: C.inkS }}>{i + 1}</td>
                    <td style={{ padding: "10px 10px" }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{t.name}</div>
                      {t.ownerName && <div style={{ fontSize: 11, color: C.inkS }}>👤 {t.ownerName}</div>}
                    </td>
                    <td style={{ padding: "10px 10px", textAlign: "center" }}>
                      <span style={{ color: C.green, fontWeight: 600, fontSize: 12 }}>✓{t.presentC}</span> <span style={{ color: C.red, fontWeight: 600, fontSize: 12 }}>✕{t.absentC}</span>
                    </td>
                    <td style={{ padding: "10px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.gold, fontSize: 13 }}>{peso(t.aykaSum)}</td>
                    <td style={{ padding: "10px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.navy, fontSize: 13 }}>{peso(t.motherSum)}</td>
                    <td style={{ padding: "10px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: C.navy, fontSize: 13 }}>{peso(t.totalDue)}</td>
                    <td style={{ padding: "10px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.green, fontSize: 13, fontWeight: 600 }}>{peso(t.paidSum)}</td>
                    <td style={{ padding: "10px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: t.balSum > 0 ? C.red : C.inkS, fontSize: 13, fontWeight: t.balSum > 0 ? 700 : 400 }}>
                      {t.balSum > 0 ? peso(t.balSum) : "—"}
                    </td>
                  </tr>
                ))}
                {tenantTotals.length > 0 && (
                  <tr style={{ background: C.goldBg, fontWeight: 700 }}>
                    <td colSpan={2} style={{ padding: "12px 10px", fontSize: 13, color: C.navy }}>GRAND TOTAL ({tenantTotals.length} tenants)</td>
                    <td style={{ padding: "12px 10px", textAlign: "center" }}><span style={{ color: C.green }}>✓{totalPresent}</span> <span style={{ color: C.red }}>✕{totalAbsent}</span></td>
                    <td style={{ padding: "12px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.gold }}>{peso(grandAyka)}</td>
                    <td style={{ padding: "12px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.navy }}>{peso(grandMother)}</td>
                    <td style={{ padding: "12px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.navy, fontSize: 14 }}>{peso(grandTotal)}</td>
                    <td style={{ padding: "12px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: C.green, fontSize: 14 }}>{peso(grandPaid)}</td>
                    <td style={{ padding: "12px 10px", textAlign: "right", fontFamily: "'JetBrains Mono', monospace", color: grandBal > 0 ? C.red : C.navy, fontSize: 14 }}>{peso(grandBal)}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
          {tenantTotals.length === 0 && loaded && (
            <div style={{ textAlign: "center", padding: 40, color: C.inkS }}>No tenants in this category.</div>
          )}
        </div>

        {showPerDay && tenantTotals.length > 0 && (
          <div className="fade-in" style={{ marginTop: 20 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.navy, marginBottom: 12, textTransform: 'uppercase', letterSpacing: 1 }}>
              Per Day Breakdown {useDateRange ? '(Day ' + fromDay + '-' + toDay + ')' : '(Full Month)'}
            </div>
            {tenantTotals.map(function(t) {
              return (
                <div key={t.id} style={{ marginBottom: 12, background: '#fff', border: '1px solid ' + C.borderL, borderRadius: 12, overflow: 'hidden' }}>
                  <button onClick={() => setExpandedTenant(expandedTenant === t.id ? null : t.id)} className="btn-hover"
                    style={{ width: '100%', padding: '14px 16px', background: expandedTenant === t.id ? '#F0F4FF' : '#fff', border: 'none', borderBottom: expandedTenant === t.id ? '1px solid ' + C.borderL : 'none', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', textAlign: 'left' }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{t.name}</div>
                      <div style={{ fontSize: 11, color: C.inkS, marginTop: 2 }}>{t.presentC} present, {t.absentC} absent, {t.signedC} signed</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ fontSize: 16, fontWeight: 700, color: C.navy }}>{peso(t.totalDue)}</div>
                      <span style={{ fontSize: 16, color: C.inkS, transition: 'transform 0.2s', transform: expandedTenant === t.id ? 'rotate(180deg)' : 'rotate(0)' }}>▼</span>
                    </div>
                  </button>
                  {expandedTenant === t.id && (
                    <div className="slide-up">
                      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                        <thead>
                          <tr style={{ background: C.paperAlt, fontSize: 10, fontWeight: 600, color: C.inkS, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                            <th style={{ padding: '8px 12px', textAlign: 'left' }}>Date</th>
                            <th style={{ padding: '8px 12px', textAlign: 'center' }}>Status</th>
                            <th style={{ padding: '8px 12px', textAlign: 'right' }}>Rent</th>
                            <th style={{ padding: '8px 12px', textAlign: 'right' }}>Total</th>
                            <th style={{ padding: '8px 12px', textAlign: 'center' }}>Signed</th>
                          </tr>
                        </thead>
                        <tbody>
                          {t.dayData.map(function(dd) {
                            return (
                              <tr key={dd.day} className="table-row" style={{ borderTop: '1px solid ' + C.borderL, background: dd.signed ? 'rgba(22,163,74,0.03)' : '#fff' }}>
                                <td style={{ padding: '7px 12px' }}>
                                  <span style={{ fontWeight: 600, fontSize: 13 }}>{dd.day}</span>
                                  <span style={{ fontSize: 11, color: C.inkS, marginLeft: 6 }}>{dd.weekday}</span>
                                </td>
                                <td style={{ padding: '7px 12px', textAlign: 'center' }}>
                                  {dd.status === 'present' ? <span style={{ color: C.green, fontWeight: 600, fontSize: 12 }}>✓ Present</span>
                                  : dd.status === 'absent' ? <span style={{ color: C.red, fontWeight: 600, fontSize: 12 }}>✕ Absent</span>
                                  : <span style={{ color: C.inkS, fontSize: 12 }}>--</span>}
                                </td>
                                <td style={{ padding: '7px 12px', textAlign: 'right', fontSize: 12, color: dd.rent > 0 ? C.ink : C.border }}>{dd.rent > 0 ? peso(dd.rent) : '--'}</td>
                                <td style={{ padding: '7px 12px', textAlign: 'right', fontSize: 13, fontWeight: 700, color: dd.total > 0 ? C.navy : C.border }}>{dd.total > 0 ? peso(dd.total) : '--'}</td>
                                <td style={{ padding: '7px 12px', textAlign: 'center' }}>
                                  {dd.signed ? <span style={{ color: C.green, fontSize: 11, fontWeight: 600 }}>Signed</span>
                                  : <span style={{ color: C.red, fontSize: 11 }}>Unsigned</span>}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function AmbaganView({ category, onBack }) {

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(`tenants:${category}`);
        setTenants(r && r.value ? JSON.parse(r.value) : []);
      } catch { setTenants([]); }
      try {
        const r = await window.storage.get(`ambagan:${category}`);
        const sheets = r && r.value ? JSON.parse(r.value) : [];
        if (sheets.length === 0) {
          sheets.push({ id: 1, name: "Ambagan 1", entries: {} });
        }
        setAmbaganSheets(sheets);
      } catch {
        setAmbaganSheets([{ id: 1, name: "Ambagan 1", entries: {} }]);
      }
      setLoaded(true);
    })();
  }, [category]);

  const saveSheets = async (sheets) => {
    setAmbaganSheets(sheets);
    const storeKey = `ambagan:${category}`;
    const jsonVal = JSON.stringify(sheets);
    try { await window.storage.set(storeKey, jsonVal); autoBackupToCloud(storeKey, jsonVal); } catch {}

    const num = ambaganSheets.length + 1;

    saveSheets(sheets);
    setActiveSheet(sheets.length - 1);

    const sheet = { ...sheets[activeSheet] };

    sheet.entries = entries;
    sheets[activeSheet] = sheet;

function UnpaidTenants({ category, onBack }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [tenants, setTenants] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [fromDay, setFromDay] = useState(1);
  const [toDay, setToDay] = useState(today.getDate());

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(`tenants:${category}`);
        setTenants(r && r.value ? JSON.parse(r.value) : []);
      } catch { setTenants([]); }
      setLoaded(true);
    })();
  }, [category]);

  const numDays = dim(year, month);
  const days = Array.from({ length: numDays }, (_, i) => i + 1);

  const [unpaidData, setUnpaidData] = useState([]);

  useEffect(() => {
    if (!loaded || tenants.length === 0) return;
    (async () => {
      const results = [];
      for (const t of tenants) {
        const key = `entries:${t.category}:${t.id}:${year}-${pad(month)}`;
        let entries = {};
        try {
          const r = await window.storage.get(key);
          if (r && r.value) entries = JSON.parse(r.value);
        } catch {}
        try {
          const cloudData = await fetchKeyFromCloud(key);
          if (cloudData) entries = mergeEntries(entries, cloudData);
        } catch(e) {}

        const rangeDays = days.filter(d => d >= fromDay && d <= toDay);
        let unpaidDays = [];
        let unpaidAmount = 0;

        rangeDays.forEach(d => {
          const e = entries[dk(year, month, d)] || { status: null, signature: null };
          const bal = rowBal(e, t);
          if (!e.signature && e.status) {
            unpaidDays.push(d);
            unpaidAmount += rowTot(e, t);
          } else if (e.signature && bal > 0) {
            unpaidDays.push(d);
            unpaidAmount += bal;
          }
        });

        if (unpaidDays.length > 0) {
          results.push({ ...t, unpaidDays, unpaidAmount, totalDays: rangeDays.length });
        }
      }
      setUnpaidData(results);
    })();
  }, [loaded, tenants, year, month, fromDay, toDay]);

  const grandUnpaid = unpaidData.reduce((s, t) => s + t.unpaidAmount, 0);

  const downloadUnpaidPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pw = 210, ph = 297, ml = 20, mr = 20;
    let y = 20;

    doc.setTextColor(27, 42, 74);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("BANAHAW FOOD PARK", pw / 2, y, { align: "center" });
    y += 7;
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(120, 115, 105);
    doc.text("Brgy. Ibabang Iyam, Lucena City", pw / 2, y, { align: "center" });
    y += 6;
    doc.setDrawColor(27, 42, 74);
    doc.setLineWidth(0.6);
    doc.line(ml, y, pw - mr, y);
    y += 10;

    doc.setTextColor(179, 48, 37);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text(`UNPAID TENANTS — ${categoryLabel(category).toUpperCase()}`, pw / 2, y, { align: "center" });
    y += 6;
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(100, 100, 100);
    doc.text(`${MONTHS[month - 1]} ${fromDay} - ${toDay}, ${year}`, pw / 2, y, { align: "center" });
    y += 10;

    const rows = unpaidData.map((t, i) => [
      i + 1,
      t.name,
      t.ownerName || "—",
      t.unpaidDays.length,
      t.totalDays,
      pesoPdf(t.unpaidAmount)
    ]);

    doc.autoTable({
      startY: y, margin: { left: ml, right: mr },
      head: [["#", "Business Name", "Owner", "Unpaid Days", "Total Days", "Amount Due"]],
      body: rows,
      styles: { fontSize: 9, cellPadding: 4 },
      headStyles: { fillColor: [179, 48, 37], textColor: [255, 255, 255], fontStyle: "bold" },
      alternateRowStyles: { fillColor: [253, 232, 230] },
      columnStyles: { 0: { cellWidth: 12 }, 5: { halign: "right", fontStyle: "bold" } }
    });

    let fy = doc.lastAutoTable.finalY || y;
    fy += 10;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.setTextColor(179, 48, 37);
    doc.text(`TOTAL UNPAID: ${pesoPdf(grandUnpaid)}`, pw - mr, fy, { align: "right" });

    doc.setFontSize(7);
    doc.setTextColor(180, 175, 168);
    doc.text("Banahaw Food Park  |  Brgy. Ibabang Iyam, Lucena City", ml, ph - 12);
    doc.text(new Date().toLocaleDateString("en-PH"), pw - mr, ph - 12, { align: "right" });

    doc.save(`Unpaid_${categoryLabel(category)}_${MONTHS[month - 1]}_${year}.pdf`);
  };

  const changeMonth = (delta) => { let m = month + delta, y = year; if (m > 12) { m = 1; y++; } else if (m < 1) { m = 12; y--; } setMonth(m); setYear(y); setToDay(dim(y, m)); };

  return (
    <div style={{ minHeight: "100vh", background: C.paper }}>
      <div style={{ background: `linear-gradient(135deg, ${C.red} 0%, #8B1A1A 100%)`, color: "#fff", padding: "24px 20px" }}>

          <button onClick={onBack} style={{ background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 8, padding: "6px 12px", color: "#fff", fontSize: 13, cursor: "pointer", marginBottom: 12 }}>← Back</button>
          <div style={{ fontSize: 22, fontWeight: 700 }}>⚠️ Unpaid Tenants — {categoryLabel(category)}</div>
          <div style={{ fontSize: 12, opacity: 0.75, marginTop: 4 }}>Tenants without signatures (unpaid)</div>
        </div>
      </div>
      <div style={{ maxWidth: 960, margin: "0 auto", padding: "20px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
          <button onClick={() => changeMonth(-1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>‹</button>
          <span style={{ fontSize: 18, fontWeight: 700, minWidth: 170, textAlign: "center", fontFamily: "'DM Serif Display', Georgia, serif", color: C.navy }}>{MONTHS[month - 1]} {year}</span>
          <button onClick={() => changeMonth(1)} className="btn-hover" style={{ padding: "8px 14px", background: "#fff", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 16, cursor: "pointer" }}>›</button>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, flexWrap: "wrap", justifyContent: "center" }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>From:</span>

            {days.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <span style={{ fontSize: 13, color: C.inkS }}>→</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.inkS }}>To:</span>
          <select value={toDay} onChange={(e) => setToDay(Number(e.target.value))}
            style={{ padding: "7px 10px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13 }}>
            {days.filter(d => d >= fromDay).map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <button onClick={downloadUnpaidPdf} className="btn-hover ripple" style={{ padding: "8px 16px", background: C.red, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>📥 Download PDF</button>
        </div>

        <div style={{ background: C.redBg, border: `1px solid #F5C6C2`, borderRadius: 12, padding: "16px 20px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.red }}>{unpaidData.length} tenant{unpaidData.length !== 1 ? 's' : ''} with unpaid balance</div>
            <div style={{ fontSize: 11, color: C.inkS, marginTop: 2 }}>{MONTHS[month - 1]} {fromDay} - {toDay}</div>
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, color: C.red, fontFamily: "'DM Serif Display', Georgia, serif" }}>{peso(grandUnpaid)}</div>
        </div>

        <div style={{ background: "#fff", border: `1px solid ${C.borderL}`, borderRadius: 12, overflow: "hidden" }}>
          {unpaidData.map((t, i) => (
            <div key={t.id} className="table-row" style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 20px", borderBottom: `1px solid ${C.borderL}`, background: i % 2 ? C.paperAlt : "#fff" }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: C.redBg, color: C.red, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 13, flexShrink: 0 }}>
                {i + 1}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: C.ink }}>{t.name}</div>
                {t.ownerName && <div style={{ fontSize: 11, color: C.inkS }}>👤 {t.ownerName}</div>}
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 11, color: C.red, fontWeight: 500 }}>{t.unpaidDays.length} day{t.unpaidDays.length !== 1 ? 's' : ''} unpaid</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: C.red, fontFamily: "'JetBrains Mono', monospace" }}>{peso(t.unpaidAmount)}</div>
              </div>
            </div>
          ))}
          {unpaidData.length === 0 && loaded && (
            <div style={{ textAlign: "center", padding: 40 }}>
              <div style={{ fontSize: 36, marginBottom: 8 }}>✅</div>
              <div style={{ fontSize: 14, fontWeight: 600, color: C.green }}>All tenants have signed!</div>
              <div style={{ fontSize: 12, color: C.inkS, marginTop: 4 }}>No unpaid tenants for this period.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


function DashboardScreen({ onSelectCategory, onLock, cloudStatus }) {
  const [stats, setStats] = useState({ tenants: 0, present: 0, absent: 0, balance: 0 });
  const [online, setOnline] = useState(navigator.onLine);

  useEffect(() => {
    const refresh = async () => {
      let totalTenants = 0, present = 0, absent = 0, balance = 0;
      const today = new Date();
      const y = today.getFullYear(), m = today.getMonth() + 1, d = today.getDate();
      for (const cat of Object.keys(CATEGORY_LABELS)) {
        try {
          const r = await window.storage.get(`tenants:${cat}`);
          const list = r && r.value ? JSON.parse(r.value) : [];
          totalTenants += Array.isArray(list) ? list.length : 0;
          if (!Array.isArray(list)) continue;
          for (const t of list) {
            try {
              const er = await window.storage.get(`entries:${cat}:${t.id}:${y}-${pad(m)}`);
              const entries = er && er.value ? JSON.parse(er.value) : {};
              const e = entries[dk(y,m,d)];
              if (e && e.status === 'present') present++;
              if (e && e.status === 'absent') absent++;
              if (e) balance += Math.max(0, rowTot(e,t) - rowPaid(e,t));
            } catch (_) {}
          }
        } catch (_) {}
      }
      setStats({ tenants: totalTenants, present, absent, balance });
    };
    refresh();
    const onlineHandler = () => setOnline(true);
    const offlineHandler = () => setOnline(false);
    window.addEventListener('online', onlineHandler);
    window.addEventListener('offline', offlineHandler);
    const timer = setInterval(refresh, 5000);
    return () => { clearInterval(timer); window.removeEventListener('online', onlineHandler); window.removeEventListener('offline', offlineHandler); };
  }, []);

  const cats = [
    ['foodtruck', '🚚', 'Food Trucks'],
    ['mobilecart', '🛒', 'Mobile Carts'],
    ['tent2x2', '⛺', 'Tent 2×2 Spaces']

        <div style={{ maxWidth:960, margin:'0 auto' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 }}>
            <div>
              <div style={{ fontSize:28, fontWeight:700, fontFamily:"'DM Serif Display', Georgia, serif" }}>Banahaw Food Park</div>
              <div style={{ fontSize:12, opacity:.75, marginTop:4 }}>Management Dashboard</div>

          </div>

            <span style={{ width:8, height:8, borderRadius:'50%', background:online ? '#7DDA91' : '#F5A6A0' }}></span>
            {online ? 'Online' : 'Offline — cached data'} {cloudStatus ? `· ${cloudStatus}` : ''}

  y+=6; doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(27,42,74); doc.text(`${tenant.name} — TENANT PAYMENT PROOF`,pw/2,y,{align:"center"});
  y+=5; doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(80,75,65); doc.text(`${categoryLabel(tenant.category)} | ${MONTHS[month-1]} ${year} | Days ${start}-${end}`,pw/2,y,{align:"center"}); y+=8;
  doc.autoTable({startY:y,margin:{left:ml,right:mr},head:[["Date","Status","Due","Paid","Balance","Covered","Paid Date","Remarks","Signature"]],body:selectedDays.map(r=>[`${MONTHS[month-1].slice(0,3)} ${r.day}`,r.e.status?(r.e.status==="present"?"Present":"Absent"):"—",pesoPdf(r.td),pesoPdf(r.pd),pesoPdf(r.bal),r.e.coveredDate||"—",r.e.datePaid||"—",r.e.remarks||"—",""]),styles:{fontSize:6.2,cellPadding:1.8,overflow:"linebreak",valign:"middle"},headStyles:{fillColor:[27,42,74],textColor:[255,255,255],fontStyle:"bold",fontSize:6.2},alternateRowStyles:{fillColor:[248,246,240]},columnStyles:{0:{cellWidth:18},1:{cellWidth:18},2:{cellWidth:19,halign:"right"},3:{cellWidth:19,halign:"right"},4:{cellWidth:19,halign:"right"},5:{cellWidth:22},6:{cellWidth:22},7:{cellWidth:28},8:{cellWidth:15,halign:"center"}},didParseCell:function(data){if(data.section==="body"&&data.column.index===8)data.cell.styles.minCellHeight=12;},didDrawCell:function(data){if(data.section==="body"&&data.column.index===8){const item=selectedDays[data.row.index];if(item&&item.signature){try{doc.addImage(item.signature,"PNG",data.cell.x+1,data.cell.y+1,data.cell.width-2,Math.min(9,data.cell.height-2));}catch(e){}}}}});
  y=(doc.lastAutoTable.finalY||y)+7; doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(27,42,74); doc.text("PAYMENT SUMMARY",ml,y); y+=5;
  doc.autoTable({startY:y,margin:{left:ml,right:mr},head:[["Selected Days","Total Due","Total Paid","Remaining Balance"]],body:[[`${start}–${end}`,pesoPdf(due),pesoPdf(paid),pesoPdf(balance)]],styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[27,42,74],textColor:[255,255,255],fontStyle:"bold"},columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right",fontStyle:"bold"}}});
  y=(doc.lastAutoTable.finalY||y)+8; doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(120,115,105); doc.text("This document is a payment/attendance record for the selected dates. Recorded tenant signatures are shown as proof where available.",ml,y); doc.text("Banahaw Food Park | Brgy. Ibabang Iyam, Lucena City",ml,ph-7); doc.text(new Date().toLocaleDateString("en-PH"),pw-mr,ph-7,{align:"right"});
  doc.save(`${tenant.name.replace(/[^a-z0-9]+/gi,"_")}_${MONTHS[month-1]}_${year}_TenantProof_Day${start}-${end}.pdf`);

function CustomerView({ tenant, onBack }) {
  const today = new Date();
  const [year,setYear] = useState(today.getFullYear());
  const [month,setMonth] = useState(today.getMonth()+1);
  const [entries,setEntries] = useState({});
  const [signingDate,setSigningDate] = useState(null);
  const [useRange,setUseRange] = useState(false);
  const [fromDay,setFromDay] = useState(1);
  const [toDay,setToDay] = useState(dim(today.getFullYear(),today.getMonth()+1));
  const storeKey = `entries:${tenant.category}:${tenant.id}:${year}-${pad(month)}`;

  const load = useCallback(async () => {
    let local = {};
    try { const r=await window.storage.get(storeKey); if(r&&r.value){const parsed=JSON.parse(r.value);local=(parsed&&typeof parsed==="object"&&!Array.isArray(parsed))?parsed:{};} } catch(_) {}
    // Local cache is only the instant fallback. Firebase is authoritative.
    try {
      const cloud = await fetchKeyFromCloud(storeKey);
      if (cloud && typeof cloud === "object") {
        local = cloud;
        await window.storage.set(storeKey, JSON.stringify(cloud)).catch(() => {});
      }
    } catch (_) {}
    setEntries(local || {});
  },[storeKey]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{
    return window.subscribeKeyFromCloud(storeKey, remote => {
      const safeRemote = (remote && typeof remote === "object" && !Array.isArray(remote)) ? remote : {}; setEntries(safeRemote); window.storage.set(storeKey,JSON.stringify(safeRemote)).catch(()=>{});
    });
  },[storeKey]);

  const getEntry = d => (entries && typeof entries === "object" ? entries[dk(year,month,d)] : null) || {status:null,signature:null};
  const saveSignature = async (d, signature) => {
    const key=dk(year,month,d);
    const next={...entries,[key]:{...getEntry(d),signature}};
    setEntries(next);
    try { await window.storage.set(storeKey,JSON.stringify(next)); } catch(_) {}
    if (typeof window.syncEntryDay === 'function') {
      const ok = await window.syncEntryDay(tenant.category,tenant.id,`${year}-${pad(month)}`,key,{signature},new Date().toISOString());
      setCloudStatus(ok ? 'synced' : 'offline', ok ? 'Database Synced ✓' : 'Offline — changes will sync automatically');
    }
    setSigningDate(null);
    window.logActivity(signature ? 'Customer signature saved' : 'Customer signature cleared', `${tenant.name} — ${key}`);
  };
  const days=Array.from({length:dim(year,month)},(_,i)=>i+1);
  const activeDays=useRange ? days.filter(d=>d>=fromDay&&d<=toDay) : days;
  const changeMonth=delta=>{let m=month+delta,y=year;if(m>12){m=1;y++;}if(m<1){m=12;y--;}setMonth(m);setYear(y);setFromDay(1);setToDay(dim(y,m));};
  return <div style={{minHeight:'100vh',background:C.paper,paddingBottom:60}}>
    <div style={{background:`linear-gradient(135deg, ${C.navy} 0%, ${C.navyL} 100%)`,color:'#fff',padding:'24px 20px 18px'}}><div style={{maxWidth:960,margin:'0 auto'}}><button onClick={onBack} style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.18)',borderRadius:8,padding:'6px 12px',color:'#fff',cursor:'pointer',marginBottom:12}}>← Back to Ledger</button><div style={{fontSize:22,fontWeight:700}}>Customer View</div><div style={{fontSize:13,opacity:.8,marginTop:4}}>{tenant.name} · {categoryLabel(tenant.category)}</div></div></div>
    <div style={{maxWidth:960,margin:'0 auto',padding:'20px'}}>
      <div style={{textAlign:'center',marginBottom:18}}><button onClick={()=>changeMonth(-1)} style={{padding:'7px 13px',border:`1px solid ${C.border}`,background:'#fff',borderRadius:8,cursor:'pointer'}}>‹</button><span style={{display:'inline-block',minWidth:170,fontWeight:700,color:C.navy}}>{MONTHS[month-1]} {year}</span><button onClick={()=>changeMonth(1)} style={{padding:'7px 13px',border:`1px solid ${C.border}`,background:'#fff',borderRadius:8,cursor:'pointer'}}>›</button></div>
      <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <button onClick={()=>onBack()} style={{padding:'8px 14px',background:'#fff',border:`1px solid ${C.border}`,borderRadius:8,cursor:'pointer',fontSize:12}}>← Back to Ledger</button>
        <button onClick={()=>{const n=!useRange;setUseRange(n);if(n){setFromDay(1);setToDay(dim(year,month));}}} style={{padding:'8px 14px',background:useRange?C.navy:'#fff',color:useRange?'#fff':C.ink,border:`1px solid ${useRange?C.navy:C.border}`,borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:600}}>📅 {useRange?'Date Range On':'Date Range'}</button>
        <button onClick={()=>downloadCustomerTenantPdf(tenant,entries,year,month,useRange?fromDay:1,useRange?toDay:dim(year,month))} style={{padding:'8px 14px',background:C.gold,color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:600}}>📥 Tenant Proof PDF</button>
      </div>
      {useRange && <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:8,flexWrap:'wrap',padding:'10px',background:'#fff',border:`1px solid ${C.borderL}`,borderRadius:10,marginBottom:14}}>
        <span style={{fontSize:12,fontWeight:600,color:C.inkS}}>From</span>
        <select value={fromDay} onChange={e=>{const v=Number(e.target.value);setFromDay(v);if(v>toDay)setToDay(v)}} style={{padding:'6px 8px',border:`1px solid ${C.border}`,borderRadius:7}}>{days.map(d=><option key={d} value={d}>{MONTHS[month-1].slice(0,3)} {d}</option>)}</select>
        <span style={{fontSize:12,color:C.inkS}}>→</span><span style={{fontSize:12,fontWeight:600,color:C.inkS}}>To</span>
        <select value={toDay} onChange={e=>{const v=Number(e.target.value);setToDay(v);if(v<fromDay)setFromDay(v)}} style={{padding:'6px 8px',border:`1px solid ${C.border}`,borderRadius:7}}>{days.filter(d=>d>=fromDay).map(d=><option key={d} value={d}>{MONTHS[month-1].slice(0,3)} {d}</option>)}</select>
        <span style={{fontSize:11,color:C.inkS}}>{activeDays.length} day{activeDays.length!==1?'s':''}</span>
      </div>}
      <div style={{background:'#fff',border:`1px solid ${C.borderL}`,borderRadius:12,overflow:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}><thead><tr style={{background:C.paper}}>{['Date','Status','Amount Due','Amount Paid','Balance','Covered Date','Date Paid','Remarks','Signature'].map(h=><th key={h} style={{padding:'10px 8px',textAlign:'left',borderBottom:`1px solid ${C.borderL}`,whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead><tbody>{activeDays.map(d=>{const e=getEntry(d);const due=rowTot(e,tenant),paid=rowPaid(e,tenant),bal=Math.max(0,due-paid);return <tr key={d}><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{MONTHS[month-1].slice(0,3)} {d}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`,color:e.status==='present'?C.green:e.status==='absent'?C.red:C.inkS,fontWeight:600}}>{e.status||'—'}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{peso(due)}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{peso(paid)}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`,color:bal>0?C.red:C.green,fontWeight:700}}>{peso(bal)}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{e.coveredDate||'—'}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{e.datePaid||'—'}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{e.remarks||'—'}</td><td style={{padding:'9px 8px',borderBottom:`1px solid ${C.borderL}`}}>{e.signature?<div style={{display:'flex',alignItems:'center',gap:6}}><img src={e.signature} alt="Signature" style={{height:28,maxWidth:90}}/><button onClick={()=>setSigningDate(d)} style={{fontSize:10,padding:'4px 7px',border:`1px solid ${C.border}`,background:'#fff',borderRadius:6,cursor:'pointer'}}>Edit</button></div>:<button onClick={()=>setSigningDate(d)} style={{padding:'6px 9px',background:C.navy,color:'#fff',border:'none',borderRadius:6,fontSize:11,cursor:'pointer'}}>✍️ Sign</button>}</td></tr>})}</tbody></table></div>
      <div style={{marginTop:12,fontSize:11,color:C.inkS}}>Customer View shows customer-facing information only. Internal Ayka Share and Mother Share details are not displayed.</div>
    </div>
    {signingDate && <SignaturePad initial={getEntry(signingDate).signature} onClose={()=>setSigningDate(null)} onSave={sig=>saveSignature(signingDate,sig)}/>} 
  </div>;
}

function App() {
  const [screen, setScreen] = useState("lock");
  const [customerTenant, setCustomerTenant] = useState(null);
  const [category, setCategory] = useState(null);
  const [tenants, setTenants] = useState([]);
  const [activeTenant, setActiveTenant] = useState(null);
  const [showModal, setShowModal] = useState(null);
  const [cloudStatus, setCloudStatus] = useState("");

  useEffect(() => {
    const onSync = (e) => {
      if (e.detail === "syncing") setCloudStatus("Syncing database…");
      else if (e.detail === "synced") { setCloudStatus("Database Synced ✓"); setTimeout(() => setCloudStatus(""), 2500); }
      else if (e.detail === "error" || e.detail === "offline") { setCloudStatus("Offline — changes will sync automatically"); setTimeout(() => setCloudStatus(""), 3500); }
      else if (e.detail) { setCloudStatus(String(e.detail)); setTimeout(() => setCloudStatus(""), 2200); }
    };
    window.addEventListener("cloudsync", onSync);
    return () => window.removeEventListener("cloudsync", onSync);
  }, []);

  useEffect(() => {
    (async () => {
      // Firebase is the source of truth. On every app start, load the existing
      // Firebase records into the local cache FIRST, without ever writing back
      // Firebase is loaded through realtime listeners and targeted reads.
      // There is intentionally no destructive startup restore.
      try {
        if (sessionStorage.getItem("rl_unlocked") === "1") {
          setScreen("dashboard");
          return;
        }
        const pinExists = await window.storage.get("pin");
        if (pinExists && pinExists.value) {
          setScreen("lock");
        } else {
          setScreen("category");
        }
      } catch {
        setScreen("category");
      }
    })();
  }, []);

  // Keep the currently selected tenant list live across every device.
  useEffect(() => {
    if (!category) return;
    const key = `tenants:${category}`;
    const unsubscribe = window.subscribeKeyFromCloud(key, (remoteList) => {
      if (Array.isArray(remoteList)) {
        setTenants(remoteList);
        window.storage.set(key, JSON.stringify(remoteList)).catch(() => {});
      }
    });
    return () => unsubscribe();
  }, [category]);

  const loadTenants = async (cat) => {
    const key = `tenants:${cat}`;
    let list = [];
    try {
      const r = await window.storage.get(key);
      if (r && r.value) list = JSON.parse(r.value);
    } catch {}
    // Local cache is only the instant fallback; Firebase remains authoritative.
    try {
      const cloudList = await fetchKeyFromCloud(key);
      if (cloudList && Array.isArray(cloudList)) {
        list = cloudList;
        await window.storage.set(key, JSON.stringify(list)).catch(() => {});
      }
    } catch(e) {}
    return list || [];
  };
  const saveSession = async (cat, tid) => { try { await window.storage.set("session", JSON.stringify({ category: cat, tenantId: tid || null })); } catch {} };
  const saveTenants = async (cat, list) => {
    const storeKey = `tenants:${cat}`;
    const jsonVal = JSON.stringify(list);
    try { await window.storage.set(storeKey, jsonVal); } catch {}
    if (typeof syncTenants === 'function') {
      await syncTenants(cat, list, new Date().toISOString(), tenants);
    }
  };

  const handleCategorySelect = async (cat) => {
    setCategory(cat);
    const list = await loadTenants(cat);
    setTenants(list);
    setScreen("tenantList");
  };

  const handleOpenTenant = async (t) => {
    setActiveTenant(t);
    setScreen("ledger");
  };

  const PRICE_FIELDS = ['presentFee','absentFee','presentMotherShare','absentMotherShare','presentAykaShare','absentAykaShare'];

  const freezeExistingEntries = async (oldTenant, newTenant) => {
    const now = new Date();
    for (let offset = 0; offset < 24; offset++) {
      const d = new Date(now.getFullYear(), now.getMonth() - offset, 1);
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const key = `entries:${oldTenant.category}:${oldTenant.id}:${y}-${pad(m)}`;
      try {
        const r = await window.storage.get(key);
        if (!r || !r.value) continue;
        const entries = JSON.parse(r.value);
        let changed = false;
        for (const ek of Object.keys(entries)) {
          const e = entries[ek];
          if (!e.status) continue;
          const p = e.status === 'present';
          if (!e.signature && offset === 0 && newTenant) {
            entries[ek].rentAmount = p ? newTenant.presentFee : newTenant.absentFee;
            entries[ek].aykaShare = p
              ? (newTenant.presentAykaShare != null ? newTenant.presentAykaShare : Math.round((Number(newTenant.presentFee)||0)*0.7))
              : (newTenant.absentAykaShare != null ? newTenant.absentAykaShare : Math.round((Number(newTenant.absentFee)||0)*0.7));
            entries[ek].motherShare = p
              ? (newTenant.presentMotherShare != null ? newTenant.presentMotherShare : ((Number(newTenant.presentFee)||0) - entries[ek].aykaShare))
              : (newTenant.absentMotherShare != null ? newTenant.absentMotherShare : ((Number(newTenant.absentFee)||0) - entries[ek].aykaShare));
            changed = true;
          } else {
            const patch = {};
            if (e.rentAmount == null) patch.rentAmount = p ? oldTenant.presentFee : oldTenant.absentFee;
            if (e.motherShare == null) patch.motherShare = p
              ? (oldTenant.presentMotherShare != null ? oldTenant.presentMotherShare : oldTenant.presentFee)
              : (oldTenant.absentMotherShare != null ? oldTenant.absentMotherShare : oldTenant.absentFee);
            if (e.aykaShare == null) patch.aykaShare = p
              ? (oldTenant.presentAykaShare != null ? oldTenant.presentAykaShare : 0)
              : (oldTenant.absentAykaShare != null ? oldTenant.absentAykaShare : 0);
            if (Object.keys(patch).length) { entries[ek] = { ...e, ...patch }; changed = true; }
          }
        }
        if (changed) {
          const jsonVal = JSON.stringify(entries);
          await window.storage.set(key, jsonVal);
          autoBackupToCloud(key, jsonVal);
        }
      } catch {}
    }
  };

  const handleSaveTenant = async (t) => {
    let next;
    const existing = tenants.find((x) => x.id === t.id);
    if (existing && PRICE_FIELDS.some((f) => Number(existing[f] ?? 0) !== Number(t[f] ?? 0))) {
      await freezeExistingEntries(existing, t);
    }
    if (existing) {
      next = tenants.map((x) => x.id === t.id ? t : x);
    } else {
      next = [...tenants, t];
    }
    setTenants(next);
    await saveTenants(category, next);
    setShowModal(null);
    window.logActivity(existing ? "Tenant updated" : "Tenant added", `${t.name} — ${categoryLabel(t.category)}`);
  };

  const handleDeleteTenant = async (id) => {
    const removed = tenants.find((t) => t.id === id);
    const next = tenants.filter((t) => t.id !== id);
    setTenants(next);
    await saveTenants(category, next);
    if (removed) window.logActivity("Tenant deleted", `${removed.name} — ${categoryLabel(removed.category)}`);
  };

  const handleCloudBackup = async () => {
    try {
      setCloudStatus("Syncing...");
      await cloudBackup();
      setCloudStatus("Synced ✓");
      setTimeout(() => setCloudStatus(""), 2000);
    } catch (e) {
      setCloudStatus("Sync failed");
      setTimeout(() => setCloudStatus(""), 3000);
    }
  };

  const handleCloudRestore = async (onDone) => {
    try {
      setCloudStatus("Restoring...");
      await cloudRestore();
      setCloudStatus("");
      window.logActivity("Data restored from cloud", "");
      if (onDone) onDone();
    } catch (e) {
      setCloudStatus("Restore failed: " + e.message);
      setTimeout(() => setCloudStatus(""), 3000);
    }
  };

  const handleLock = () => {
    setScreen("lock");
    setActiveTenant(null);
    setCategory(null);
    setCustomerTenant(null);
    try { window.storage.delete("session"); } catch {}
    try { sessionStorage.removeItem("rl_unlocked"); } catch {}
  };

  return (
    <>
      {screen === "lock" && <LockScreen onUnlock={() => { try { sessionStorage.setItem("rl_unlocked", "1"); } catch {} setScreen("dashboard"); setCategory(null); }} />}

      {screen === "dashboard" && <DashboardScreen onSelectCategory={handleCategorySelect} onLock={handleLock} cloudStatus={cloudStatus} />}

      {screen === "category" && <CategoryScreen onSelect={handleCategorySelect} onLock={handleLock} onCloudBackup={handleCloudBackup} onCloudRestore={handleCloudRestore} cloudStatus={cloudStatus} />}

      {screen === "tenantList" && (
        <TenantListScreen
          tenants={tenants} category={category}
          onOpen={handleOpenTenant}
          onAdd={(cat) => { setShowModal({ type: "add", category: cat }); }}
          onEdit={(t) => { setShowModal({ type: "edit", tenant: t }); }}
          onBack={() => setScreen("category")}
          onDelete={handleDeleteTenant}
          onLock={handleLock}
          onCategoryReport={(cat) => { setCategory(cat); setScreen("categoryReport"); }}
          onAmbagan={(cat) => setScreen("ambagan")}
          onUnpaidTenants={(cat) => setScreen("unpaidTenants")}
        />
      )}

      {screen === "ledger" && activeTenant && (
        <Ledger tenant={activeTenant} onBack={() => { setActiveTenant(null); setScreen("tenantList"); saveSession(category, null); }} onCustomerView={(t) => { setCustomerTenant(t); setScreen("customerView"); }} />
      )}

      {screen === "customerView" && customerTenant && <CustomerView tenant={customerTenant} onBack={() => setScreen("ledger")} />}

      {screen === "categoryReport" && (
        <CategoryReport category={category} onBack={() => setScreen("tenantList")} />
      )}

      {screen === "ambagan" && (
        <AmbaganView category={category} onBack={() => setScreen("tenantList")} />
      )}

      {screen === "unpaidTenants" && (
        <UnpaidTenants category={category} onBack={() => setScreen("tenantList")} />
      )}

      {showModal && (
        <TenantModal
          tenant={showModal.type === "edit" ? showModal.tenant : null}
          category={showModal.category || (showModal.tenant && showModal.tenant.category) || category}
          onSave={handleSaveTenant}
          onClose={() => setShowModal(null)}
        />
      )}
    </>
  );
}

class BanahawErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(error){ return {error:error}; }
  componentDidCatch(error, info){ console.error("Banahaw UI error:", error, info); }
  render(){
    if(this.state.error){
      return <div style={{minHeight:"100vh",background:"#FAFAF7",display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"Inter,Arial,sans-serif"}}>
        <div style={{maxWidth:560,background:"#fff",border:"1px solid #DDD8CC",borderRadius:14,padding:24,boxShadow:"0 10px 30px rgba(0,0,0,.08)"}}>
          <div style={{fontSize:20,fontWeight:700,color:"#1B2A4A",marginBottom:8}}>Something went wrong on this page.</div>
          <div style={{fontSize:13,color:"#5C5C5C",lineHeight:1.6,marginBottom:14}}>The data in Firebase is safe. Reload the page and try again. If this happens again, the technical error below will help us identify the exact screen problem.</div>
          <pre style={{whiteSpace:"pre-wrap",fontSize:11,color:"#B33025",background:"#FDE8E6",padding:12,borderRadius:8,overflow:"auto"}}>{String(this.state.error && this.state.error.stack || this.state.error)}</pre>
          <button onClick={()=>location.reload()} style={{padding:"10px 16px",background:"#1B2A4A",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>Reload</button>
        </div>
      </div>;
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<BanahawErrorBoundary><App /></BanahawErrorBoundary>);
</script>
</body>
</html>
